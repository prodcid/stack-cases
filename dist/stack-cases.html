const CURIOS=[
 ['zero','Zero Day','Pattern 000',it=>it.p===0],
 ['sev','Lucky Sevens','Pattern 777',it=>it.p===777],
 ['trip','Triples','Three of the same digit, like 444',it=>{const d=String(it.p).padStart(3,'0');return d[0]===d[1]&&d[1]===d[2]&&it.p!==0&&it.p!==777}],
 ['lad','Ladder','Digits counting up, like 345',it=>['012','123','234','345','456','567','678','789'].includes(String(it.p).padStart(3,'0'))],
 ['cnt','Countdown','Digits counting down, like 543',it=>['210','321','432','543','654','765','876','987'].includes(String(it.p).padStart(3,'0'))],
 ['match','Matched','Pattern number equals the first three float digits',it=>it.f.toFixed(6).slice(2,5)===String(it.p).padStart(3,'0')],
 ['mirror','Mirror Float','First four float digits read the same both ways',it=>{const s=it.f.toFixed(6).slice(2,6);return s[0]===s[3]&&s[1]===s[2]&&s!=='0000'}],
 ['clean','Clean Float','Float within 0.0001 of a round number like 0.15',it=>it.f>.005&&Math.abs(it.f*100-Math.round(it.f*100))<.01],
 ['floor','Rock Bottom','The lowest float this skin can have',it=>{const r=SK[it.s].fr;return it.f-r[0]<(r[1]-r[0])*.0006}],
 ['ceil','Maxed Out','The highest float this skin can have',it=>{const r=SK[it.s].fr;return r[1]-it.f<(r[1]-r[0])*.0006&&r[1]<1}]];

    ()=>({d:'Any StatTrak™ Master item or better',m:1.3,q:it=>it.st&&SK[it.s].t>=3}),

function wireBounties(){document.querySelectorAll('[data-bty]').forEach(b=>b.onclick=()=>{const B=btyGen(),i=+b.dataset.bty,bt_=B.L[i],L=S.items.filter(it=>!it.lk&&bt_.q(it)).sort((a,b)=>a.v-b.v);
  const {m,close}=modal(`<h2>Hand in to ${esc(bt_.who)}</h2><p class="sub" style="margin:6px 0 12px">${esc(bt_.d)}. Pick one.</p><div class="sgrid">${L.slice(0,60).map(it=>`<div data-hi="${it.id}">${tileHTML(it,{val:money(it.v+btyBonus(bt_,it.v))})}</div>`).join('')}</div>`,'wide');
  m.querySelectorAll('[data-hi]').forEach(d=>d.onclick=()=>{const it=S.items.find(x=>x.id==d.dataset.hi);if(!it||B.done.includes(i))return;const pay=Math.round((it.v+btyBonus(bt_,it.v))*100)/100;
    removeItems([it]);credit(pay);B.done.push(i);if(bt_.who==='Dazza')rivalAdd(Object.assign({},it,{id:++_uid,h:(it.h||[]).concat([[Date.now(),'Sold to Dazza for a bounty']]).slice(-8)}));
    ev('bty');addXP(80);save();close();A.coin(4);burst('#4cd964',140);toast('Bounty paid',`+${money(pay)}`);drawStreet()})})}

/* ================= AUCTION HOUSE =================
   One lot every 15 minutes. Bots bid on what it looks like. If Dazza is bidding,
   he knows something. Highest bid when the clock runs out wins, and you pay one
   step above the next best bid. Your bid is held until the lot closes. */
function aucLot(t){if(S.aucLot&&S.aucLot.t===t)return S.aucLot;const r=mulberry(t*389+11),cs=VAULTABLE().filter(C=>C.lvl<=Math.max(3,S.lvl)&&C.skins[4].length);if(!cs.length)return null;
  const C=cs[Math.floor(r()*cs.length)],sp=r()<.6,L=sp?C.skins[4]:C.skins[3],sk=L[Math.floor(r()*L.length)];let p=Math.floor(r()*1000),gem=false;
  if(sp&&r()<.3){const G=gemPs(sk);if(G.length){p=G[Math.floor(r()*G.length)];gem=true}}if(p===grailOf(sk))p=(p+1)%1000;
  const it={s:sk.id,f:sk.fr[0]+Math.pow(r(),1.4)*(sk.fr[1]-sk.fr[0]),p,st:r()<.12,c:sk.ci};it.v=valueOf(it);const nv=naiveValue(it);
  let max=nv*(.82+r()*.3),lead=BOTS.filter(b=>b!=='Dazza')[Math.floor(r()*(BOTS.length-1))],dz=false;
  if((gem||it.v>nv*1.5)&&r()<.7){const dm=it.v*(.72+r()*.16);if(dm>max){max=dm;lead='Dazza';dz=true}}
  const start=nv*.35,inc=Math.max(1,Math.round(nv*.02*100)/100),bidders=[lead,...BOTS.filter(b=>b!==lead&&b!=='Dazza').sort(()=>r()-.5).slice(0,3)];
  return S.aucLot={t,it,max,start,inc,lead,dz,bidders}}
const aucFrac=t=>cl01((Date.now()-t*MK_STEP)/MK_STEP);
const botNow=L=>L.start+(L.max-L.start)*Math.min(1,Math.pow(aucFrac(L.t),.55)*1.12);
function aucState(){const t=mkTick(),L=aucLot(t);if(!L)return null;const my=S.auc&&S.auc.t===t?S.auc.bid:0,b=botNow(L);
  const youLead=my>b,price=youLead?Math.min(my,b):Math.min(L.max,Math.max(b,my?my+L.inc:0));return{L,my,price,youLead,leader:youLead?'You':(b>=L.max*.999||my?L.lead:L.bidders[Math.floor(aucFrac(t)*7)%L.bidders.length])}}
function aucResolve(){if(!S.auc||S.auc.t>=mkTick())return;const a=S.auc;S.auc=null;const L=a.lot;
  if(a.bid>L.max){const pay=Math.min(a.bid,L.max+L.inc);credit(a.bid-pay);const it=Object.assign({},L.it,{id:++_uid});it.v=valueOf(it);setOrigin(`Won at auction for ${money(pay)}`);gotItem(it);setOrigin();ev('aucW');
    S.stats.aucW=(S.stats.aucW||0)+1;if(L.dz)S.beatDazza=1;save();setTimeout(()=>{A.upWin();burst('#ffd24a',220);toast('You won the auction',`${fullName(it)} for ${money(pay)}. Worth ${money(it.v)}.`)},600)}
  else{credit(a.bid);save();setTimeout(()=>toast('Outbid at auction',`${L.lead} took it for ${money(Math.min(L.max,a.bid+L.inc))}. Your ${money(a.bid)} is back.`,1),600)}}
function auctionHTML(){aucResolve();const A_=aucState();if(!A_)return'<div class="empty">No lot right now.</div>';const {L,my,price,youLead,leader}=A_,it=L.it,sk=SK[it.s],cd=condOf(it.f);
  const feed=L.bidders.slice(0,Math.max(1,Math.ceil(aucFrac(L.t)*4))).map((b,i)=>`<span>${esc(b)}</span>`).join('');
  return `<div class="sec"><h2>Auction house</h2><span class="sub">One lot every 15 minutes. Highest bid at the bell wins, at one step above the next best. Your bid is held until it closes.</span></div>
   <div class="auc r${sk.t}"><div class="aimg"><img src="${itemImg(it,560)}" alt=""></div>
    <div class="ainfo"><b class="aname">${esc(fullName(it))}</b><span class="sub">${tierName(sk.t)} · ${cd[1]}</span>
     <div class="chips"><span class="chip">Pattern ${it.p}</span><span class="chip">Float ${it.f.toFixed(6)}</span>${it.st?'<span class="chip st">ST™</span>':''}</div>
     <div class="abid"><div><span class="sub">Current bid</span><b>${money(price)}</b></div><div><span class="sub">Leading</span><b class="${youLead?'up':leader==='Dazza'?'dzc':''}">${esc(leader)}</b></div><div><span class="sub">Closes in</span><b data-mkcd>${mkLeft()}</b></div></div>
     ${leader==='Dazza'&&!youLead?'<p class="dhint"><span class="gdot"></span>Dazza is bidding hard on this. He only does that when he knows something.</p>':''}
     <p class="sub">Bidders so far: <span class="feed">${feed}</span>${my?` · Your max bid: <b>${money(my)}</b>`:''}</p>
     <div class="abtns">${[1.05,1.2,1.5].map(x=>{const v=Math.round(Math.max(price+L.inc,(my||0)+L.inc)*x*100)/100;return `<button class="btn${x===1.05?' pri':''}" data-ab="${v}">Bid ${money(v)}</button>`}).join('')}</div>
     <div class="acustom"><input id="abIn" inputmode="decimal" placeholder="Your max bid" aria-label="Your max bid"><button class="btn" id="abGo">Set max</button></div></div></div>`}
function wireAuction(){const place=v=>{const A_=aucState();if(!A_)return;v=Math.round(v*100)/100;const my=A_.my;if(v<=my){toast('Bid higher than your current max','',1);return}if(v<A_.price+A_.L.inc&&!A_.youLead){toast(`Bid at least ${money(A_.price+A_.L.inc)}`,'',1);return}
    if(!spend(v-my)){A.err();toast('Not enough balance to cover that bid','Top up',1);return}S.auc={t:A_.L.t,bid:v,lot:A_.L};save();A.coin(2);const n=aucState();toast(n.youLead?"You're winning":'Outbid already',n.youLead?'Bid held until the bell':`${n.leader} has a higher max`,!n.youLead);drawStreet()};
  document.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>place(+b.dataset.ab));const g=$('abGo');if(g)g.onclick=()=>{const v=parseFloat(($('abIn').value||'').replace(/[$,\s]/g,''));if(!(v>0)){toast('Type a number','',1);return}place(v)}}

/* ================= UNBOX DERBY =================
   Four bots race: same case, same number of rounds, highest total wins.
   Each racer is equally likely, so the odds are exact: 3.88x for the winner,
   11.64x to call first and second in order. */
let dby={ci:null,rounds:3,type:'win',pick:[],stake:100,lanes:null};
function derbyHTML(){const cs=unlockedCases(S.lvl).filter(c=>!c.free&&!c.sp);if(dby.ci==null||!cs.some(c=>c.ci===dby.ci))dby.ci=cs[Math.min(cs.length-1,2)].ci;
  if(!dby.lanes||dby.lanesFor!==dby.ci+':'+dby.rounds){const r=BOTS.slice().sort(()=>Math.random()-.5).slice(0,4);dby.lanes=r;dby.lanesFor=dby.ci+':'+dby.rounds;dby.pick=[]}
  const mult=dby.type==='win'?3.88:11.64,need=dby.type==='win'?1:2,ready=dby.pick.length===need&&dby.stake>0;
  return `<div class="sec"><h2>Unbox Derby</h2><span class="sub">Four racers open the same case. Highest total after the last round wins. Back a racer at 3.88x, or call the top two in order at 11.64x.</span></div>
   <div class="dsetup"><div class="drow"><span class="sub">Case</span><select id="dCase" aria-label="Race case">${cs.map(c=>`<option value="${c.ci}" ${c.ci===dby.ci?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
     <div class="seg" id="dRounds">${[3,5,8].map(n=>`<button data-n="${n}" class="${dby.rounds===n?'on':''}">${n} rounds</button>`).join('')}</div></div>
    <div class="seg" id="dType"><button data-t="win" class="${dby.type==='win'?'on':''}">Winner · 3.88x</button><button data-t="exa" class="${dby.type==='exa'?'on':''}">Top two in order · 11.64x</button></div>
    <div class="lanes" id="lanes">${dby.lanes.map((n,i)=>{const pi=dby.pick.indexOf(i);return `<button class="lane${pi>=0?' pk':''}" data-l="${i}"><span class="lno">${i+1}</span><b>${esc(n)}</b>${pi>=0?`<em>${dby.type==='exa'?(pi?'2nd':'1st'):'Your pick'}</em>`:''}<div class="ltrack"><i></i><img alt=""></div><span class="ltot">$0.00</span></button>`}).join('')}</div>
    <div class="drow"><span class="sub">Stake</span><div class="seg" id="dStake">${[10,100,1000,10000,100000].map(v=>`<button data-v="${v}" class="${dby.stake===v?'on':''}">${money(v).replace('.00','')}</button>`).join('')}</div></div>
    <button class="btn pri go" id="dGo" ${ready?'':'disabled'}>${ready?`Bet ${money(dby.stake)} to win ${money(dby.stake*mult)}`:dby.type==='win'?'Pick a racer':'Pick 1st then 2nd'}</button></div>`}
function wireDerby(){const re=()=>{if(!busy)drawStreet()};
  $('dCase').onchange=e=>{dby.ci=+e.target.value;re()};$('dRounds').querySelectorAll('button').forEach(b=>b.onclick=()=>{dby.rounds=+b.dataset.n;re()});
  $('dType').querySelectorAll('button').forEach(b=>b.onclick=()=>{dby.type=b.dataset.t;dby.pick=[];re()});
  $('dStake').querySelectorAll('button').forEach(b=>b.onclick=()=>{dby.stake=+b.dataset.v;re()});
  $('lanes').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(busy)return;const i=+b.dataset.l,need=dby.type==='win'?1:2,k=dby.pick.indexOf(i);if(k>=0)dby.pick.splice(k,1);else{if(dby.pick.length>=need)dby.pick.shift();dby.pick.push(i)}A.click&&A.click();re()});
  $('dGo').onclick=runDerby}
async function runDerby(){if(busy)return;const stake=dby.stake,mult=dby.type==='win'?3.88:11.64;if(!spend(stake)){A.err();toast('Not enough balance','Top up',1);return}
  busy=true;A.init();const C=CASES[dby.ci],tot=[0,0,0,0],lanes=[...document.querySelectorAll('#lanes .lane')];document.querySelector('.dsetup').classList.add('racing');$('dGo').disabled=true;$('dGo').textContent='And they\'re off…';
  for(let r=0;r<dby.rounds;r++){A.drum();const its=[0,1,2,3].map(()=>overdrive(C.ci,rollItem(C.ci)));its.forEach((it,i)=>{botClaim(it,dby.lanes[i]);tot[i]+=it.v});
    await sleep(160);const mx=Math.max(...tot);its.forEach((it,i)=>{const l=lanes[i];l.querySelector('img').src=itemImg(it,140);l.querySelector('.ltrack i').style.width=(tot[i]/mx*100)+'%';l.querySelector('.ltot').textContent=money(tot[i]);
      l.classList.remove('r0','r1','r2','r3','r4','r5');l.classList.add('r'+tierOf(it));if(tierOf(it)>=3){l.classList.add('flash');setTimeout(()=>l.classList.remove('flash'),500)}});
    A.reveal(Math.max(...its.map(tierOf)));const ord=[0,1,2,3].sort((a,b)=>tot[b]-tot[a]);lanes.forEach((l,i)=>l.style.order=ord.indexOf(i));await sleep(r===dby.rounds-1?400:950)}
  const ord=[0,1,2,3].sort((a,b)=>tot[b]-tot[a]),close_=(tot[ord[0]]-tot[ord[1]])/tot[ord[0]]<.03;
  if(close_){toast('Photo finish','',1);await sleep(900)}
  const win=dby.type==='win'?ord[0]===dby.pick[0]:ord[0]===dby.pick[0]&&ord[1]===dby.pick[1];
  lanes[ord[0]].classList.add('winner');
  if(win){const pay=Math.round(stake*mult*100)/100;credit(pay);ev('derbyW');S.stats.dbyW=(S.stats.dbyW||0)+1;A.upWin();burst('#4cd964',220);toast(`${dby.lanes[ord[0]]} wins`,`You collect ${money(pay)}`)}
  else{A.shatter();toast(`${dby.lanes[ord[0]]} wins`,`Your bet of ${money(stake)} is gone`,1)}
  addXP(10+Math.sqrt(stake)*2);save();checkAch();busy=false;$('dGo').disabled=false;$('dGo').textContent='Race again';$('dGo').onclick=()=>{dby.lanes=null;drawStreet()}}

/* ================= THE STREET (tab) ================= */
let stTabS='live';
const STABS=[['live','Today'],['derby','Derby'],['auc','Auction'],['bty','Bounties'],['cur','Curios']];
function drawStreet(){if(busy&&stTabS==='derby')return;const seg=`<div class="seg ptab" id="sTab">${STABS.map(([k,n])=>`<button data-t="${k}" class="${stTabS===k?'on':''}">${n}</button>`).join('')}</div>`;

const curioMini=()=>`<div class="sec"><h2>Curios</h2><span class="sub">${Object.keys(S.cur).length} of ${CURIOS.length} found${S.lost?'':`. Find ${Math.max(0,LOST_NEED-Object.keys(S.cur).length)} more and see what happens`}.</span></div>`;

/* ================= DOUBLE OR NOTHING MILESTONES ================= */
const DON_MS={3:[600,'On a heater'],5:[2500,'Fearless'],7:[8000,'Untouchable'],10:[40000,'Legend of the Wheel']};
function donMilestone(n,it){const m=DON_MS[n];if(!m)return;addXP(m[0]);S.donBest=Math.max(S.donBest||0,n);if(it)it.h=(it.h||[]).concat([[Date.now(),`Survived a ${n}-in-a-row double or nothing`]]).slice(-8);
  setTimeout(()=>{A.jackpot('grail');burst('#ffd24a',260);toast(`${n} in a row: ${m[1]}`,`+${m[0].toLocaleString()} XP. Next milestone: ${Object.keys(DON_MS).map(Number).find(x=>x>n)||'none, you did it all'}`)},900)}
const donNext=n=>{const k=Object.keys(DON_MS).map(Number).find(x=>x>n);return k?`${k-n} more to "${DON_MS[k][1]}"`:'Every milestone hit'};

/* ---------- hooks into the rest of the game ---------- */
const _drawShop=drawShop;drawShop=function(){_drawShop();$('v-cases').insertAdjacentHTML('afterbegin',evBanner());wireEv();
  if(S.lost&&!$('lostGo')){const C=CASES.find(c=>c.secret),g=$('cgrid');if(g){g.insertAdjacentHTML('afterbegin',`<button class="ccard lostcard" id="lostGo" style="--cc:#9fd8ff">${caseImg(C)}<b>${esc(C.name)}</b><span class="pr">${money(C.price)}<small>Secret</small></span></button>`);$('lostGo').onclick=()=>openCasePage(C.ci)}}};
const _drawTU=drawTU;drawTU=function(){_drawTU();const v=$('v-tu');if(!v.querySelector('#wkTab')){v.insertAdjacentHTML('afterbegin',wkSeg('tu'));wireWk()}};
setInterval(evTick,1000);evApply();msInit();

/* ---------- prices tick over every 6 hours; the market every 15 minutes ---------- */
let lastPT=priceTick(),lastMK=mkTick();
setInterval(()=>{document.querySelectorAll('[data-mkcd]').forEach(e=>e.textContent=mkLeft());
  if(priceTick()!==lastPT){lastPT=priceTick();S.items.forEach(it=>it.v=valueOf(it));CAT=null;ftCache=null;drawBal();if(!busy&&!document.querySelector('.modal')){if(view==='cases')drawShop();if(view==='stash')drawStash();if(view==='upg')drawUpg()}}
  rivalTick();if(mkTick()!==lastMK){lastMK=mkTick();if(view==='work'&&!busy&&!document.querySelector('.modal'))drawWork();if(view==='stash'&&stTab==='market'&&!busy&&!document.querySelector('.modal'))drawStash()}},1000);
/* ---------- warm-up: work out pattern ranks one model at a time while the game is idle,
   so the first trip to the upgrader doesn't stall ---------- */
(()=>{const models=[...new Set(Object.values(SK).filter(sk=>sk.fin==='tempered').map(sk=>sk.w))],jobs=models.map(w=>()=>temperRank(w));
  Object.values(SK).filter(sk=>sk.t>=4).forEach(sk=>jobs.push(()=>grailOf(sk)));jobs.push(()=>catalogue());
  const idle=window.requestIdleCallback||(f=>setTimeout(()=>f({timeRemaining:()=>8}),60));
  const run=d=>{while(jobs.length&&d.timeRemaining()>4)jobs.shift()();if(jobs.length)idle(run)};setTimeout(()=>idle(run),1500)})();
/* ---------- boot ---------- */
const setH=()=>document.documentElement.style.setProperty('--hdr',document.querySelector('.top').offsetHeight+'px');setH();addEventListener('resize',setH);addEventListener('pagehide',()=>saveNow());document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
count=S.prefs.count||1;quick=!!S.prefs.quick;S.items.concat(S.gems).forEach(noteCodex);drawBal();drawLvl();drawSnd();drawShop();checkAch();
setTimeout(botDrop,600);for(let i=0;i<6;i++)setTimeout(()=>{const pool=CASES.filter(C=>REG(C)&&C.price<=100),C=pool[i%pool.length];pushTicker(rollItem(C.ci,2+(i%3===0)),BOTS[(i*5)%BOTS.length])},50*i);
window.StackCases={feat:()=>FEAT,cat:()=>catalogue(),forceAng:f=>{FORCE.ang=f},force:t=>{FORCE.t=t},forceEd:e=>{FORCE.ed=e},bmOpen:()=>{S.bm.next=Date.now()},xp:n=>addXP(n),state:()=>S,sfx:A};
};

/* ================= CLOUD SAVE =================
   When the game runs as a Claude artifact, your save lives in your account (the db capability,
   in your own private folder) as well as in this browser. On open, whichever copy is newer wins,
   so a new version, a cleared browser or a different phone never starts you from scratch.
   Saves are split into chunks (a document holds 256 KB) and written to two alternating slots,
   so a half-finished upload can never corrupt the last good save. */
(function(){
  const KEY='stackCases.v2',CH=120000,C=window.__cloud={on:false,last:0,err:'',blocked:false};
  let local=null;try{local=localStorage.getItem(KEY)}catch(e){}
  const ts=j=>{if(!j)return 0;try{return JSON.parse(j)._ts||1}catch(e){return 0}};
  let started=false;
  const cover=document.createElement('div');cover.id='bootCover';cover.innerHTML='<div><b>Loading your save</b><span>Checking your account for the latest progress…</span></div>';
  const start=json=>{if(started)return;started=true;window.__SAVE=json||null;cover.remove();window.__startApp()};
  if(!window.claude||!window.claude.use){start(local);return}
  document.body.appendChild(cover);
  let timedOut=false;const timer=setTimeout(()=>{timedOut=true;start(local)},9000);
  async function readCloud(){const m=await C.db.doc(C.base+'/save').get();if(!m.exists)return null;const d=m.data();if(!d||!d.n)return null;
    const parts=await Promise.all(Array.from({length:d.n},(_,i)=>C.db.doc(C.base+'/save_'+d.slot+'_'+i).get()));
    const txt=parts.map(p=>p.exists?(p.data().d||''):'').join('');if(txt.length!==d.len)return null;return txt}
  let writing=false,pending=null,t=0;
  async function push(json){if(!C.on||C.blocked)return;if(writing){pending=json;return}writing=true;
    try{const meta=(await C.db.doc(C.base+'/save').get()),cur=meta.exists?meta.data():null,slot=cur&&cur.slot==='a'?'b':'a',n=Math.max(1,Math.ceil(json.length/CH));
      for(let i=0;i<n;i++)await C.db.doc(C.base+'/save_'+slot+'_'+i).set({d:json.slice(i*CH,(i+1)*CH)});
      await C.db.doc(C.base+'/save').set({slot,n,len:json.length,ts:ts(json)});C.last=Date.now();C.err=''}
    catch(e){C.err=(e&&e.code)||'error'}
    writing=false;if(pending){const p=pending;pending=null;push(p)}
    const el=document.getElementById('saveStat');if(el)el.textContent=window.__cloudStatus()}
  window.__cloudSave=json=>{if(!C.on||C.blocked)return;pending=null;clearTimeout(t);t=setTimeout(()=>push(json),2500)};
  window.__cloudPushNow=json=>{clearTimeout(t);return push(json)};
  window.__cloudStatus=()=>!C.on?'Not connected. Progress is saved in this browser only.':C.blocked?'A newer save is in your account. Reload to use it.':C.err?`Last cloud save failed (${C.err}). It will retry on your next save.`:C.last?'Saved to your account '+new Date(C.last).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}):'Connected to your account. Saving as you play.';
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&C.on&&!C.blocked&&!window.__restoring&&window.__lastJSON){clearTimeout(t);push(window.__lastJSON())}});
  (async()=>{try{const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user){clearTimeout(timer);return start(local)}
      const uid=await user.id();if(!uid){clearTimeout(timer);return start(local)}
      C.db=db;C.base='data/users/'+uid;let cloud=null;try{cloud=await readCloud()}catch(e){cloud=null}
      C.on=true;
      if(timedOut){if(ts(cloud)>ts(local)){C.blocked=true;const b=document.createElement('button');b.className='cloudbar';b.textContent='A newer save is in your account. Tap to load it.';b.onclick=()=>location.reload();document.body.appendChild(b)}return}
      clearTimeout(timer);const useCloud=ts(cloud)>ts(local);start(useCloud?cloud:local);
      if(!useCloud&&local)push(local);else if(useCloud)C.last=Date.now()}
    catch(e){clearTimeout(timer);start(local)}})();
})();
</script>

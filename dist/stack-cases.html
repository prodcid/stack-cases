<!doctype html><html><head><meta charset=utf8><meta name="stack-version" content="2026.10.08.1"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stack Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#000;--panel:#141415;--panel2:#1d1d1f;--line:#2a2a2d;--line2:#3a3a3e;--steel:#8b8b92;--mute:#b9b9bf;--bone:#f2f2f0;
  --up:#4cd964;--dn:#ff5a52;--gold:#ffd24a;
  --t0:#4b69ff;--t1:#8847ff;--t2:#d32ce6;--t3:#eb4b4b;--t4:#ffd700;--t5:#e4ae39;
  --r:14px;--nav-h:64px;
  font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variation-settings:'wdth' 92;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--bone);font-variant-numeric:tabular-nums}
body{min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.4}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;font-variation-settings:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
button:disabled{cursor:not-allowed}
img{display:block;-webkit-user-drag:none;user-select:none}
.up{color:var(--up)}.dn{color:var(--dn)}
h2{font-size:22px;font-weight:750;letter-spacing:-.01em;font-variation-settings:'wdth' 100,'opsz' 48}
h3{font-size:16px;font-weight:700}
.sub{font-size:13px;color:var(--steel);font-weight:500}
.sub b{color:var(--bone);font-weight:700}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:auto}
.brand svg{width:26px;height:26px}
.brand span{font-weight:800;font-size:19px;letter-spacing:-.02em;font-variation-settings:'wdth' 100,'opsz' 96}
.brand em{font-style:normal;font-weight:400;color:var(--steel);font-size:19px;font-variation-settings:'wdth' 100,'opsz' 96}
.lvl{position:relative;width:38px;height:38px;flex:none}
.lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.wallet{display:flex;align-items:center;border-radius:999px;background:var(--panel2);border:1px solid var(--line);padding:3px 3px 3px 14px;gap:10px}
.bal{font-weight:750;font-size:15px;min-width:76px;text-align:right;transition:color .3s}
.bal.fu{color:var(--up)}.bal.fd{color:var(--dn)}
.topup{white-space:nowrap;background:var(--bone);color:#000;font-weight:750;font-size:13px;padding:7px 13px;border-radius:999px}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.icon svg{width:20px;height:20px}
@media (max-width:420px){.brand em{display:none}.bal{min-width:0;font-size:14px}.topup{padding:7px 10px;font-size:12px}.wallet{padding-left:10px;gap:7px}.bar{gap:6px}.icon{width:32px}}

/* live drops */
.ticker{overflow:hidden;border-top:1px solid var(--line);height:58px;position:relative;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk{display:flex;gap:6px;padding:5px 14px;height:100%}
.tkI{flex:none;width:112px;height:48px;border-radius:8px;background:var(--panel);border-bottom:2px solid var(--tc);position:relative;overflow:hidden;animation:tkin .5s cubic-bezier(.2,.8,.2,1)}
.tkI::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 100%,var(--tc),transparent 70%);opacity:.28}
.tkI img{position:absolute;left:4px;top:3px;width:62px}
.tkI span{position:absolute;right:6px;top:6px;font-size:10px;color:var(--steel);text-align:right;line-height:1.15;max-width:52px;overflow:hidden}
.tkI b{position:absolute;right:6px;bottom:5px;font-size:11px;font-weight:750}
.tkI.me{outline:1px solid var(--bone);outline-offset:-1px}
@keyframes tkin{from{transform:translateX(-30px);opacity:0}}

/* tabs: top on desktop, bottom bar on phones */
.tabs{position:sticky;top:var(--hdr,108px);z-index:39;display:flex;gap:2px;padding:0 max(10px,calc(50% - 610px));background:rgba(0,0,0,.92);border-bottom:1px solid var(--line)}
.tabs button{position:relative;display:flex;align-items:center;gap:7px;padding:12px 14px;font-weight:650;font-size:14px;color:var(--steel);border-radius:0}
.tabs button svg{width:18px;height:18px}
.tabs button.on{color:var(--bone)}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--bone);border-radius:2px}
.tabs button .lk{width:11px;height:11px;opacity:.7}
.tabs button .dot{position:absolute;top:8px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;max-width:none;top:auto}
  .tabs button{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px}
  .tabs button svg{width:22px;height:22px}
  .tabs button.on::after{top:0;bottom:auto;left:30%;right:30%}
  .tabs button .lk{position:absolute;top:5px;right:calc(50% - 18px)}
  main{padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom))!important}
}
main{max-width:1240px;margin:0 auto;padding:16px 14px 40px}
.view{display:none}.view.on{display:block;animation:vin .25s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.sec{display:flex;align-items:baseline;gap:4px 12px;margin:22px 0 12px;flex-wrap:wrap}
.sec h2{white-space:nowrap}
.sec:first-child{margin-top:4px}
.sec .sub{margin-left:auto;text-align:right}
@media (max-width:520px){.sec .sub{margin-left:0;text-align:left;flex-basis:100%}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:750;font-size:15px;background:var(--panel2);border:1px solid var(--line2);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--bone);color:#000;border-color:var(--bone)}
.btn.gold{background:linear-gradient(180deg,#ffe28a,#e8b52a);color:#2a1a00;border-color:#ffe28a}
.btn:disabled{background:var(--panel);color:var(--steel);border-color:var(--line);transform:none}
.seg{display:flex;gap:2px;background:var(--panel);padding:3px;border-radius:11px;border:1px solid var(--line)}
.seg button{min-width:40px;padding:9px 11px;border-radius:8px;font-weight:700;font-size:14px;color:var(--steel)}
.seg button.on{background:var(--bone);color:#000}
.tog{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--mute);padding:9px 4px}
.tog i{width:36px;height:21px;border-radius:21px;background:var(--line2);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on i{background:var(--bone)}.tog.on i::after{left:18px;background:#000}

/* ---------- hero / daily ---------- */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:20px;border-radius:20px;background:#0a0a0a;border:1px solid var(--line);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-28deg,transparent 0 22px,rgba(255,255,255,.025) 22px 44px)}
.hero>*{position:relative}
.hero h2{font-size:clamp(24px,6vw,34px);line-height:1;letter-spacing:-.03em;margin-bottom:8px}
.hero .caseimg{width:clamp(120px,32vw,210px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.8))}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.streak{display:flex;gap:4px;margin-top:10px}
.streak i{width:22px;height:6px;border-radius:3px;background:var(--line2)}
.streak i.on{background:var(--bone)}.streak i.gold{background:var(--gold)}

/* ---------- case shop ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
@media (max-width:520px){.cgrid{grid-template-columns:1fr 1fr}}
.ccard{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:6px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .15s}
.ccard:hover{border-color:var(--line2)}
.ccard:active{transform:scale(.98)}
.ccard::before{content:"";position:absolute;left:-20%;right:-20%;top:-30%;height:80%;background:radial-gradient(closest-side,var(--cc),transparent);opacity:.18}
.ccard .caseimg{position:relative;width:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.7))}
.ccard b{position:relative;font-size:15px;font-weight:700;line-height:1.15}
.ccard .pr{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:750}
.ccard .pr small{font-size:11.5px;color:var(--steel);font-weight:600}
.ccard .tok{position:absolute;top:10px;right:10px;z-index:2;background:var(--bone);color:#000;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.ccard.locked .caseimg{filter:grayscale(1) brightness(.35)}
.ccard.locked::before{opacity:0}
.ccard .lock{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-bottom:40px;font-size:13px;font-weight:700;color:var(--mute)}
.ccard .lock svg{width:22px;height:22px}

/* ---------- tiles ---------- */
.tile{position:relative;flex:none;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#1f1f22,#141416);display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:3px solid var(--tc);text-align:center}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 55%,var(--tc),transparent 75%);opacity:.22}
.tile img{position:relative;width:92%;height:auto}
.tile .n{position:relative;font-size:11px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
.tile .k{position:relative;font-size:10.5px;color:var(--steel);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94%}
.tile .v{position:relative;font-size:11.5px;font-weight:750;margin-top:2px}
.tile.gold{background:radial-gradient(circle at 50% 42%,#fff6c2,#e8b000 46%,#5a3c00);border-bottom-color:#fff3a0}
.tile.gold::before{display:none}
.tile.gold .star{font-size:44px;line-height:1;color:#fff;text-shadow:0 0 18px #fff3a0,0 2px 0 #8a6000}
.tile.gold .n{color:#3a2600}
.tile.unk{background:#0c0c0d;border-bottom-color:var(--line2)}
.tile.unk img{filter:brightness(0) opacity(.5)}
.tile.unk::before{display:none}
.r0{--tc:var(--t0)}.r1{--tc:var(--t1)}.r2{--tc:var(--t2)}.r3{--tc:var(--t3)}.r4{--tc:var(--t4)}.r5{--tc:var(--t5)}
.badge{position:absolute;top:5px;left:5px;z-index:2;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;background:#ff8a1a;color:#1a0a00}
.gem{position:absolute;top:5px;right:5px;z-index:2;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;background:linear-gradient(90deg,#3a7aff,#9ae0ff);color:#021030;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- case page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:14px;color:var(--mute);margin-bottom:10px;padding:6px 0}
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stage{position:relative;background:#000;border:1px solid var(--line);border-radius:20px;min-height:240px;padding:16px 0;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:-40%;height:80%;background:radial-gradient(closest-side,var(--glow,rgba(255,255,255,.07)),transparent);pointer-events:none;transition:background .15s}
.stage .bigcase{position:relative;z-index:1;width:min(64vw,290px);margin:0 auto;filter:drop-shadow(0 20px 26px rgba(0,0,0,.8))}
.stage .bigcase .caseimg{width:100%}
.stage .bigcase.shake{animation:shake .62s}
@keyframes shake{10%,50%,90%{transform:rotate(-3deg) scale(1.03)}30%,70%{transform:rotate(3deg) scale(1.03)}100%{transform:scale(1.12);opacity:0}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 6px}
.controls .go{margin-left:auto}
@media (max-width:520px){.controls .go{width:100%;margin-left:0}}
.odds{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:16px 0 6px}
.odds i{background:var(--tc)}
.contents h3{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.contents h3 i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.contents h3 span{color:var(--steel);font-weight:600;font-size:13px;margin-left:auto}
.cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.cgrid2 .tile{height:128px}

/* reel */
.reel{position:relative;z-index:1;height:var(--rh);overflow:hidden;--glow:transparent}
.reel::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:200px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);opacity:.5;transition:background .1s;pointer-events:none;z-index:1}
.strip{position:absolute;top:0;left:0;height:100%;display:flex;gap:4px;will-change:transform;z-index:2}
.strip .tile{width:var(--tw);height:100%}
.reel .mk{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8);z-index:4}
.reel .mk::before,.reel .mk::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:7px solid transparent}
.reel .mk::before{top:4px;border-top-color:#fff}.reel .mk::after{bottom:4px;border-bottom-color:#fff}
.reel .fade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,#000 0,transparent 16%,transparent 84%,#000 100%)}
.reel.v .strip{flex-direction:column;width:100%;height:auto}
.reel.v .strip .tile{width:100%;height:var(--tw)}
.reel.v .mk{left:-4px;right:-4px;top:50%;bottom:auto;width:auto;height:2px;margin:-1px 0 0}
.reel.v .mk::before{left:4px;top:50%;transform:translateY(-50%);border-left-color:#fff;border-top-color:transparent}
.reel.v .mk::after{left:auto;right:4px;top:50%;bottom:auto;transform:translateY(-50%);border-right-color:#fff;border-bottom-color:transparent}
.reel.v .fade{background:linear-gradient(180deg,#000 0,transparent 22%,transparent 78%,#000 100%)}
.reel.v::before{left:0;right:0;top:50%;bottom:auto;width:auto;height:140px;transform:translateY(-50%)}
.tile.win{animation:winpop .6s ease-out;box-shadow:0 0 0 2px var(--tc),0 0 26px var(--tc)}
@keyframes winpop{40%{transform:scale(1.08)}}
.special{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,215,0,.32),rgba(0,0,0,.94) 70%);animation:fadein .3s}
.special b{font-size:clamp(22px,6vw,34px);font-weight:800;color:var(--gold);text-shadow:0 0 22px rgba(255,215,0,.8);animation:pulse .45s infinite alternate;text-align:center;font-variation-settings:'wdth' 100}
.special.cx{background:radial-gradient(circle,rgba(228,174,57,.45),rgba(0,0,0,.96) 70%)}
@keyframes pulse{to{transform:scale(1.06)}}@keyframes fadein{from{opacity:0}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:14px;animation:fadein .2s}
.mbox{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}
.mbox.wide{max-width:900px}
.x{position:absolute;top:10px;right:10px;font-size:24px;color:var(--mute);width:36px;height:36px;z-index:5}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.rays{position:absolute;left:50%;top:120px;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--tc) 0 5deg,transparent 5deg 15deg);opacity:.16;animation:spin 16s linear infinite;-webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.shine{position:relative;width:100%;max-width:520px;perspective:900px;touch-action:none}
.shine .in{position:relative;transform-style:preserve-3d;transition:transform .12s linear}
.shine img{width:100%}
.shine .gl{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;
  background:linear-gradient(115deg,transparent calc(var(--sx,30%) - 14%),rgba(255,255,255,.55) var(--sx,30%),transparent calc(var(--sx,30%) + 14%));mix-blend-mode:overlay}
.shine .gl.auto{animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%{--sx:-20%}60%,100%{--sx:120%}}
@property --sx{syntax:'<percentage>';inherits:false;initial-value:30%}
.rname{font-size:22px;font-weight:800;line-height:1.1;font-variation-settings:'wdth' 100}
.rname small{display:block;font-size:14px;font-weight:650;color:var(--tc);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.chip.st{background:#ff8a1a;color:#1a0a00;border:0}.chip.gemc{background:linear-gradient(90deg,#3a7aff,#9ae0ff);color:#021030;border:0}.chip.fl{background:var(--bone);color:#000;border:0}
.flt{width:100%;max-width:360px}
.flt .b{display:flex;height:8px;border-radius:4px;overflow:hidden}
.flt .b i:nth-child(1){flex:7;background:#2ad07a}.flt .b i:nth-child(2){flex:8;background:#8ad84a}.flt .b i:nth-child(3){flex:23;background:#e8c84a}.flt .b i:nth-child(4){flex:7;background:#e8884a}.flt .b i:nth-child(5){flex:55;background:#e84a4a}
.flt .m{position:relative;height:10px}.flt .m span{position:absolute;top:0;border:6px solid transparent;border-top:0;border-bottom:8px solid #fff;transform:translateX(-6px)}
.flt .sl{display:flex;font-size:10px;font-weight:700;color:var(--steel)}
.flt .sl i{font-style:normal;overflow:hidden;text-align:center}.flt .sl i:nth-child(1){flex:7}.flt .sl i:nth-child(2){flex:8}.flt .sl i:nth-child(3){flex:23}.flt .sl i:nth-child(4){flex:7}.flt .sl i:nth-child(5){flex:55}
.flt .sl i.on{color:#fff}
.flt .t{font-size:13px;color:var(--mute);margin-top:6px}.flt .t b{color:#fff}
.rank{font-size:12.5px;color:var(--mute)}
.val{font-size:36px;font-weight:800;letter-spacing:-.02em}
.btns{display:flex;gap:8px;width:100%;margin-top:8px}
.btns .btn{flex:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.mgrid .tile{height:150px;cursor:pointer}
.mgrid .tile.sold{opacity:.3}

/* ---------- stash / pickers ---------- */
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.shead .tot{font-size:14px;color:var(--steel);font-weight:600}.shead .tot b{color:var(--bone);font-size:20px;font-weight:800}
select{background:var(--panel2);color:var(--bone);border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font-weight:600;font-size:13px}
.shead select{margin-left:auto}

/* knife moves */
.mv-flipout{animation:flipout 1.3s cubic-bezier(.4,0,.2,1)}
@keyframes flipout{20%{transform:rotateX(180deg) scale(.9)}45%{transform:rotateX(360deg) rotateZ(-20deg)}70%{transform:rotateX(540deg) rotateZ(10deg)}100%{transform:rotateX(720deg)}}
.mv-spin{animation:kspin 1.2s cubic-bezier(.3,0,.2,1)}
@keyframes kspin{0%{transform:rotate(0)}60%{transform:rotate(-700deg) scale(.92)}100%{transform:rotate(-720deg)}}
.mv-snap{animation:snap .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes snap{0%{transform:rotate(0)}25%{transform:rotate(-150deg) scale(.85)}55%{transform:rotate(12deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.mv-push{animation:push .8s ease-in-out}
@keyframes push{30%{transform:translateX(-10%) scale(.94)}55%{transform:translateX(8%) scale(1.04)}100%{transform:none}}
.mv-toss{animation:toss 1.2s cubic-bezier(.3,0,.2,1)}
@keyframes toss{30%{transform:translateY(-14%) rotate(-200deg)}65%{transform:translateY(-6%) rotate(-340deg)}100%{transform:rotate(-360deg)}}
.mv-tilt{animation:gtilt 1.4s ease-in-out}
@keyframes gtilt{25%{transform:rotateY(35deg) rotateZ(-6deg)}55%{transform:rotateY(-30deg) rotateZ(5deg)}80%{transform:rotateX(18deg)}100%{transform:none}}
.mv-flex{animation:gflex 1.2s ease-in-out}
@keyframes gflex{30%{transform:rotateY(180deg) scale(.95)}60%{transform:rotateY(360deg) rotateZ(-6deg)}100%{transform:rotateY(360deg)}}
/* living finishes on the big reveal */
.shine.fx-nebula img,.shine.fx-gamma img{animation:neb 5s ease-in-out infinite alternate}
@keyframes neb{to{filter:hue-rotate(18deg) brightness(1.12) saturate(1.2)}}
.shine.fx-hellfire img,.shine.fx-lava img{animation:fire 1.1s steps(6) infinite}
@keyframes fire{0%,100%{filter:brightness(1)}20%{filter:brightness(1.18) saturate(1.2)}45%{filter:brightness(.94)}70%{filter:brightness(1.12)}}
.shine.fx-sovereign .gl,.shine.fx-gold .gl{background:linear-gradient(115deg,transparent calc(var(--sx,30%) - 10%),rgba(255,214,90,.8) var(--sx,30%),transparent calc(var(--sx,30%) + 10%))}
.shine.fx-tempered .gl.auto,.shine.fx-fade .gl.auto,.shine.fx-marble .gl.auto,.shine.fx-damascus .gl.auto{animation-duration:1.8s}
.shine.fx-bloodline img{animation:bpulse 2.2s ease-in-out infinite}
@keyframes bpulse{50%{filter:brightness(1.15) saturate(1.25)}}
.shine.fx-brightwater img,.shine.fx-hydro img{animation:water 4s ease-in-out infinite alternate}
@keyframes water{to{filter:hue-rotate(-14deg) brightness(1.1)}}
.shine.fx-plasma img,.shine.fx-circuit img{animation:volt 2.4s steps(8) infinite}
@keyframes volt{0%,100%{filter:none}40%{filter:brightness(1.25) contrast(1.1)}42%{filter:none}}
/* case opening: shake, lift, light spill */
.stage .bigcase.opening{animation:copen .98s ease-in forwards}
@keyframes copen{0%,40%{transform:none}8%,24%{transform:rotate(-3deg) scale(1.03)}16%,32%{transform:rotate(3deg) scale(1.03)}62%{transform:translateY(-10px) scale(1.06)}100%{transform:translateY(-30px) scale(1.3);opacity:0}}
.beam{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;z-index:3;pointer-events:none;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.7) 30%,transparent 70%);animation:beam .9s .45s ease-out forwards;opacity:0}
@keyframes beam{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(14)}}
/* cabinet */
.cab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:20px;background:linear-gradient(180deg,#121214,#050506);border:1px solid var(--line);box-shadow:inset 0 30px 60px -30px rgba(255,255,255,.08)}
@media (min-width:761px){.cab{grid-template-columns:repeat(6,1fr)}}
.cabslot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;border-radius:14px;background:radial-gradient(60% 50% at 50% 30%,color-mix(in srgb,var(--tc) 30%,transparent),transparent 75%),#0c0c0e;border:1px solid #232326;text-align:center}
.cabslot::after{content:"";position:absolute;left:12%;right:12%;bottom:30px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.cabslot .iw{width:100%}.cabslot b{font-size:12px;margin-top:4px}.cabslot .sub{font-size:11px}
/* cases */
.ccard.vaulted .caseimg{filter:grayscale(.7) brightness(.55)}
.vtag{position:absolute;top:10px;left:10px;z-index:2;background:#3ab0ff;color:#001a2a;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.vlt{color:#3ab0ff}.cstat{margin:-4px 0 10px}
.sec .btn.sm{margin-left:8px}
/* upgrader extras */
.eqline{font-size:13px;color:var(--steel);margin:-6px 0 10px}.eqline b{color:var(--bone)}
.seg.wzone button{font-size:12.5px;padding:8px 10px}
.fill{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.ses{font-size:12.5px;color:var(--steel);text-align:center;max-width:300px}
.pools{margin-top:-2px}
.tile.myst{background:radial-gradient(circle at 50% 40%,#2a2a2e,#0c0c0e)}
.tile.myst .q{position:relative;font-size:52px;font-weight:800;line-height:1;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
.tile.mk .v{color:var(--gold)}

.seg.wzone{flex-wrap:nowrap}.seg.wzone button{white-space:nowrap}
.tile .chm{width:11%}

.btn.more{display:flex;width:100%;margin-top:10px}

/* ---------- upgrader tray ---------- */
.tray{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:52;width:min(96vw,640px);padding:10px;border-radius:18px;
  background:rgba(18,18,20,.97);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.7);transition:transform .18s ease-out;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tray.on{transform:translate(-50%,0)}
@media (min-width:761px){.tray{bottom:16px}}
.trow{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tit{position:relative;flex:none;width:76px;padding:4px 4px 3px;border-radius:10px;background:var(--panel2);border-bottom:2px solid var(--tc);text-align:center}
.tit img{width:100%;display:block}.tit span{font-size:10.5px;font-weight:750}
.tit button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bone);color:#000;font-size:15px;font-weight:800;line-height:22px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.tit.empty-slot{display:grid;place-items:center;border:1px dashed var(--line2);background:none;color:var(--steel);font-size:11px;min-height:58px}
.tbar{display:flex;align-items:center;gap:8px}.tbar>div{flex:1;min-width:0}.tbar small{display:block;font-size:12px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbar b{font-size:18px;font-weight:800}
.tbar .btn{padding:11px 16px}
#v-upg{padding-bottom:150px}
.upbar{display:none!important}
@media (max-width:900px){#upgo{display:none}}

.tray:not(.on){display:none}
.tray.on{animation:trayin .18s ease-out}
@keyframes trayin{from{transform:translate(-50%,30px);opacity:0}}

/* cash + rare finds */
.cash{width:100%;max-width:330px;display:flex;flex-direction:column;gap:6px;align-items:center}
.cbtns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.crow{display:flex;gap:6px;width:100%;justify-content:center}.crow .numin{max-width:170px}
.tit.cashc{border-bottom-color:var(--up)}.cico{height:44px;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--up)}
.gems{margin-bottom:12px}.grow{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
.gcard{flex:none;width:132px;border-radius:12px;padding:0}.gcard .tile{width:100%}.gcard.on .tile{outline:2px solid var(--bone);outline-offset:-2px}

/* keep the three upgrader columns inside the screen */
.upg>*{min-width:0}
.pane{min-width:0;overflow:hidden}
#upTgP .sgrid{max-height:560px;overflow-y:auto}
.gems .grow{max-width:100%}

/* ---------- gamble ---------- */
.gm{display:grid;grid-template-columns:1fr 420px;gap:14px;align-items:start}
@media (max-width:900px){.gm{grid-template-columns:1fr}.gm .gmstage{order:-1}}
.gm>*{min-width:0}
.gmstage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;border-radius:20px;background:#0a0a0a;border:1px solid var(--line)}
#v-gam{padding-bottom:150px}
.coinw{perspective:800px;padding:10px}
.coin{position:relative;width:150px;height:150px;transform-style:preserve-3d}
.cf{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:radial-gradient(circle at 35% 30%,#ffffff,#d8d8dc 45%,#8a8a92);box-shadow:inset 0 0 0 6px #b8b8be,inset 0 0 0 9px #f4f4f6,0 14px 30px rgba(0,0,0,.6)}
.cf svg{width:58%;height:58%}
.cf.b{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#3a3a3e,#141416 55%,#000);box-shadow:inset 0 0 0 6px #2a2a2e,inset 0 0 0 9px #55555b,0 14px 30px rgba(0,0,0,.6)}
.vs{width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.vside{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.vside b{font-size:15px}.vside span{font-weight:800}
.vside .trow{flex-wrap:wrap;justify-content:center;overflow:visible}.vside .tit{width:60px}
.vmid{align-self:center;font-weight:800;color:var(--steel)}
.jpot{text-align:center}.jnum{font-size:38px;font-weight:800;letter-spacing:-.02em}
.jbar{display:flex;width:100%;height:12px;border-radius:6px;overflow:hidden;gap:2px}.jbar i{display:block;transition:flex .4s}
.jlist{width:100%;display:flex;flex-direction:column;gap:4px}
.jp{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--panel)}
.jp i{width:12px;height:12px;border-radius:4px}.jp em{font-style:normal;font-weight:800;min-width:52px;text-align:right}.jp.me{outline:1px solid var(--bone)}
.jchip .jav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#000;margin-bottom:4px}
#gmStage .stage{width:100%}

.btns{flex-wrap:wrap}.btns .btn{min-width:calc(33% - 8px)}

/* ---------- stickers ---------- */
.stko{position:absolute;width:9%;min-width:12px;transform:translate(-50%,-50%) rotate(-6deg);z-index:2;pointer-events:none}
.stko svg{display:block;width:100%;height:auto}
.stko.big{width:8%}
.stk{opacity:calc(1 - var(--w,0)*.65);filter:grayscale(calc(var(--w,0)*.8))}
.stk.holo{animation:prism 5s linear infinite}
.stk .sh{animation:stsh 3.4s ease-in-out infinite}
@keyframes stsh{0%,30%{transform:skewX(-20deg) translateX(0)}70%,100%{transform:skewX(-20deg) translateX(90px)}}
.chcard.stc svg.stk{width:64px;height:64px}
.chbig svg.stk{width:150px;height:150px;animation:none}
.chbig svg.stk.holo{animation:prism 5s linear infinite}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.capsule .capimg svg.stk{width:84px;height:84px}
.stkbar{width:100%;margin-top:12px}.stkslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:6px}
.sslot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;background:var(--panel2);border:1px dashed var(--line2);min-height:96px;justify-content:center}
.sslot.full{border-style:solid}.sslot svg.stk{width:46px;height:46px}.sslot span{font-size:11.5px;color:var(--steel)}

.tile .stko{width:12%}

/* ================= world: grails, first editions, history ================= */
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px;box-shadow:0 0 8px var(--gold)}
.glft{margin:4px 0 10px}
.badge.feb{left:auto;right:5px;top:24px;background:#9fd8ff;color:#001a2a;font-size:8.5px}
.chip.fec{background:#9fd8ff;color:#001a2a;border:0;font-weight:800}
.chip.ooc{background:var(--panel2);color:var(--bone);border:1px solid var(--bone);font-weight:750}
.chip.fgc{background:linear-gradient(90deg,#ff7a2a,#ffd24a,#fff2c0);color:#2a1000;border:0;font-weight:800}
.hist{margin:14px auto 0;max-width:520px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hist h3{font-size:14px;margin-bottom:6px}
.hrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.hrow:first-of-type{border-top:0}
.hrow b{font-weight:750;color:var(--bone)}.hrow span{color:var(--mute)}
.hrow.g b{color:var(--gold)}
.dhint{font-size:13px;font-weight:650;color:var(--bone);background:#1a1508;border:1px solid #4a3a10;border-radius:12px;padding:10px 12px;margin:-2px 0 12px}

/* ================= Dazza ================= */
.vault{background:linear-gradient(180deg,#141008,#0a0a0a);border:1px solid #3a2e10;border-radius:20px;padding:16px;margin:8px 0 18px}
.vhead h2{color:var(--gold)}
.vrow{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.vrow::-webkit-scrollbar{display:none}
.vt{flex:none;width:132px;cursor:pointer}.vt.on .tile{outline:2px solid var(--gold);outline-offset:-2px}
.rvbar{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#1a1508;border:1px solid #4a3a10;border-radius:14px;padding:12px 14px;margin:12px 0}
.rvbar>div{display:flex;flex-direction:column;gap:2px}.rvbar b{font-size:14px}
.sgrid.stk{max-height:46vh;overflow-y:auto}

/* ================= workshop ================= */
#wkTab{flex-wrap:wrap}
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.seed{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.seed b{font-size:15px}.seed .btn{margin-top:6px;width:100%}
.sil{position:relative;width:100%;border-radius:12px;background:radial-gradient(circle at 50% 60%,#2a2a10,#0a0a0a 70%);display:grid;place-items:center;padding:10px;overflow:hidden}
.sil img{width:100%;filter:brightness(0) drop-shadow(0 0 1px rgba(255,215,0,.8)) drop-shadow(0 0 10px rgba(255,215,0,.35));transition:filter .6s}
.sil span{position:absolute;font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 0 16px rgba(255,215,0,.6)}
.sil.big{max-width:520px;margin:10px auto 0}
.sil.lit img{filter:none}.sil.lit span{display:none}
.scrw{text-align:center}
.digs{display:flex;gap:10px;justify-content:center}
.dig{position:relative;width:80px;height:100px;border-radius:14px;background:#0a0a0a;border:2px solid var(--line2);display:grid;place-items:center;overflow:hidden}
.dig b{font-size:56px;font-weight:800;color:var(--gold)}
.dig canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.dig.next{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,74,.2)}
.dig:not(.next):not(.done) canvas{filter:brightness(.55)}
.dig.nudge{animation:nudge .4s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.poss{margin:14px auto 0;max-width:520px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.phead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.prow{display:grid;grid-template-columns:1fr auto 90px;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.prow em{font-style:normal;color:var(--steel)}.prow b{text-align:right}
.prow.pgem span{color:#9ae0ff;font-weight:700}.prow.pgr span{color:var(--gold);font-weight:800}.prow.out{opacity:.5}.prow.out span{text-decoration:line-through}
.appr{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
@media (max-width:720px){.appr{grid-template-columns:1fr}}
.guess{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.guess b{font-size:34px;font-weight:800;text-align:center}
.guess input{width:100%;accent-color:#fff}
.gends{display:flex;justify-content:space-between;font-size:12px;color:var(--steel)}
.guess .go{width:100%;margin-top:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px;margin:8px 0}
.cmp>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.cmp b{font-size:20px}
.grind{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px 14px;margin-bottom:6px}
.gpass{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.gpass>div{background:#0a0a0a;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.gpass b{font-size:15px}.gpass em{font-style:normal;font-size:12px;color:var(--steel);font-weight:700}.gpass em.up{color:var(--up)}.gpass em.dn{color:var(--dn)}
@media (max-width:520px){.gpass{grid-template-columns:1fr}.gpass>div{flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap}}
#grSh{position:relative}
#grSh.grinding .in{animation:grindShake .09s infinite}
@keyframes grindShake{50%{transform:translate(1px,-1px) rotate(.3deg)}}
#grSh.cracked .in{animation:crack .8s forwards}
@keyframes crack{30%{filter:brightness(2)}100%{transform:scale(.9) rotate(-4deg);opacity:0;filter:grayscale(1)}}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;bottom:30%;width:4px;height:4px;border-radius:50%;background:#ffd88a;box-shadow:0 0 6px #ffb02a;animation:spark .6s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.forge{background:linear-gradient(180deg,#1a0e04,#0a0a0a);border:1px solid #4a2a10;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fslots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:520px){.fslots{grid-template-columns:repeat(3,1fr)}}
.fs{position:relative;aspect-ratio:1.6;border-radius:10px;border:1px dashed var(--line2);background:#0a0a0a;display:grid;place-items:center}
.fs.req{border-color:#6a4a20}
.fs.on{border:1px solid #ff9a3a;box-shadow:0 0 12px rgba(255,140,40,.25)}
.fs img{width:90%}
.fs button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#000;border:1px solid var(--line2);font-size:14px;line-height:1}
.fout{display:grid;grid-template-columns:1fr;gap:8px}
.fout>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fout>div>.sub{width:52px}
.fmod{flex-wrap:wrap}.fmod button{padding:6px 10px;font-size:13px;border-radius:8px}
.fname{font-size:18px;font-weight:800;color:#ffd88a}
.forge .go{width:100%}
.forging{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.forging b{font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:#ffd88a}
.fring{position:relative;width:260px;height:260px;animation:fspin 1.7s cubic-bezier(.5,0,.2,1) forwards}
.fring img{position:absolute;left:50%;top:50%;width:110px;margin:-22px 0 0 -55px;transform:rotate(var(--a)) translateY(-100px) rotate(calc(-1 * var(--a)));animation:fin 1.7s ease-in forwards}
.fring .core{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:#ffd88a;box-shadow:0 0 40px 20px rgba(255,160,40,.6);animation:fcore 1.7s ease-in forwards}
@keyframes fspin{to{transform:rotate(540deg)}}
@keyframes fin{to{transform:rotate(var(--a)) translateY(0) rotate(calc(-1 * var(--a))) scale(.2);opacity:0}}
@keyframes fcore{to{transform:scale(4)}}
.forging.burst{animation:fflash .7s forwards}
@keyframes fflash{0%{background:#fff}100%{background:rgba(0,0,0,0);opacity:0}}

/* ================= save ================= */
#bootCover{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;text-align:center;padding:24px}

<script>
/* ================= ITEM ART =================
   Weapons are vector silhouettes (240x96 box). Skins are procedural textures clipped into them,
   then shaded, worn and outlined on a canvas. Every item is baked once and cached. */
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o=4){let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=a*vnoise(x*f,y*f,s+i*17);n+=a;f*=2.03;a*=.5}return v/n}
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const cl01=t=>t<0?0:t>1?1:t;
const sstep=(a,b,x)=>{const t=cl01((x-a)/(b-a));return t*t*(3-2*t)};
function grad(stops,t){t=cl01(t);const n=stops.length-1,i=Math.min(n-1,Math.floor(t*n)),f=t*n-i;return mix(stops[i],stops[i+1],f)}
const seedOf=(p,fin)=>((p+1)*7919+fin.length*104729+fin.charCodeAt(0)*31)|0;
const hseed=(p,fin)=>mulberry(seedOf(p,fin))();
/* ================= SCENE FINISHES (Neon District) =================
   Graphic finishes that are laid out like a picture rather than a repeating texture.
   Each has info(p) (what pattern p is) and make(p,F) which returns (x,y)->[r,g,b].
   F is the part of the picture that's actually visible on the item, in picture units,
   so the countable features (chevrons, slashes, palms, skulls...) always land where you can see them. */
const SCENES=(()=>{
const add3=(c,col,k)=>[c[0]+col[0]*k,c[1]+col[1]*k,c[2]+col[2]*k];
const clamp3=c=>[Math.min(255,Math.max(0,c[0])),Math.min(255,Math.max(0,c[1])),Math.min(255,Math.max(0,c[2]))];
const lum=(c,k)=>k>0?mix(c,[255,255,255],k):mix(c,[0,0,0],-k);
const AA=d=>cl01(d+.5),paint=(c,col,d)=>mix(c,col,AA(d)),shadowK=(d,soft=3)=>cl01((d+soft)/(soft*2));
const H=c=>hx(c.length===4?'#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]:c),BLK=[0,0,0],WHT=[255,255,255];
const count3=(h,a,b)=>h<a?3:h<b?2:1;
const geo=F=>({W:F.x1-F.x0,Hh:F.y1-F.y0,cx:(F.x0+F.x1)/2,cy:(F.y0+F.y1)/2});
/* n points inside F, kept apart where there's room */
function spreadF(r,n,minD,F,px=.12,py=.15){const g=geo(F),P=[],rx=()=>F.x0+g.W*px+r()*g.W*(1-2*px),ry=()=>F.y0+g.Hh*py+r()*g.Hh*Math.max(0,1-2*py);
  for(let k=0;k<300&&P.length<n;k++){const q=[rx(),ry()];if(P.every(o=>Math.hypot(o[0]-q[0],o[1]-q[1])>minD))P.push(q)}while(P.length<n)P.push([rx(),ry()]);return P}
const S={};

/* ---------- HAZARD ---------- */
S.hazard={name:'Hazard',
  info(p){const n=count3(hseed(p,'haz'),.03,.18),bo=hseed(p,'hazB')<.03;const N=['','','Double Chevron','Triple Chevron'][n];
    const tag=bo&&n===3?'Black Ops':bo?'Blackout'+(n>1?' · '+N:''):N,mult=bo&&n===3?25:(bo?5:1)*[1,1,1.4,3.5][n];return{n,bo,tag,mult,stat:`${n} chevron${n>1?'s':''}${bo?', blacked out':''}`}},
  make(p,F){const I=this.info(p),g=geo(F),r=mulberry(seedOf(p,'hazpos')),a=.55+r()*.5,ca=Math.cos(a),sa=Math.sin(a),off=(r()-.5)*g.Hh*.15,k=seedOf(p,'haz')%911;
    const W=I.bo?H('#2a2a2e'):H('#efeee9'),Wd=I.bo?H('#151517'):H('#c9c8c1'),B=H('#121214'),O=H('#ff6200');
    // chevrons sit on the seam, spaced along the visible length
    const span=Math.min(46,g.W/(I.n+1)),ch=Array.from({length:I.n},(_,i)=>({t:(i-(I.n-1)/2)*span+(r()-.5)*8}));
    const gu=[-70+r()*30,10+r()*40,80+r()*30],gv=[-48-r()*20,-110-r()*20];
    const decals=Array.from({length:3},()=>({u:-100+r()*200,v:-30-r()*100,w:18+r()*30}));
    const UV=(x,y)=>[(x-g.cx)*ca+(y-g.cy)*sa,-(x-g.cx)*sa+(y-g.cy)*ca-off];
    const seam=(u,v)=>7-Math.abs(v),chev=(u,v)=>{let m=-99;for(const q of ch){const du=u-q.t,w=Math.abs(v)*.85-du;m=Math.max(m,Math.min(9-Math.abs(w),30-Math.abs(v)))}return m};
    return(x,y)=>{const[u,v]=UV(x,y);let c;
      if(v<0){c=mix(Wd,W,cl01(.55+u/380+v/520));
        for(const q of gu){const d=u-q;if(Math.abs(d)<1.1)c=lum(c,-.35);else if(d>1.1&&d<2.4)c=lum(c,.35)}
        for(const q of gv){const d=v-q;if(Math.abs(d)<1.1)c=lum(c,-.35);else if(d>1.1&&d<2.4)c=lum(c,.35)}
        for(const q of gu)for(const h of gv){const d=Math.hypot(u-q-7,v-h-7);if(d<3.2)c=lum(I.bo?H('#3a3a40'):H('#9a9a94'),d<1.4?.4:-.1)}
        for(const d of decals){if(Math.abs(v-d.v)<3&&u>d.u&&u<d.u+d.w)c=I.bo?H('#4a4a50'):H('#222224');if(Math.abs(v-d.v-7)<1.4&&u>d.u&&u<d.u+d.w*.4)c=O}}
      else{c=mix(H('#1c1c20'),B,cl01(v/120));c=lum(c,(hash2(0,(v*2+u*.05)|0,k)-.5)*.08);
        if(v>16&&v<30){const st=Math.floor((u+v)/9)&1;c=st?lum(O,-.15):H('#141416');if(v<17.5||v>28.5)c=H('#0a0a0b')}
        if(Math.abs(v-44)<1)c=H('#2a2a2e');
        const[su,sv]=UV(x-3,y-5),sd=Math.max(seam(su,sv),chev(su,sv));if(sd>-4)c=mix(c,BLK,.55*shadowK(sd,3))}
      const sd=seam(u,v);if(sd>-1){c=paint(c,mix(lum(O,.25),lum(O,-.3),cl01((v+7)/14)),sd);if(Math.abs(v+5.5)<.8)c=lum(c,.35)}
      const cd=chev(u,v);if(cd>-4){c=paint(c,H('#0a0a0b'),cd+3);if(cd>-1){let oc=mix(lum(O,.3),lum(O,-.25),cl01((v+30)/60));if(cd<2.2)oc=lum(oc,.2);c=paint(c,oc,cd)}}
      c=lum(c,.06*Math.exp(-Math.abs((x-y*.4)-g.cx*.6)/30));
      return c}}};

/* ---------- NEON NOIR ---------- */
S.noir={name:'Neon Noir',
  info(p){const n=count3(hseed(p,'noir'),.03,.2),hc=hseed(p,'noirC'),col=hc<.012?'gold':hc<.06?'red':'neon';const CN={gold:'Gold Noir',red:'Red Room',neon:''},CM={gold:12,red:3,neon:1},NN=['','','Double Slash','Triple Slash'];
    const tag=[CN[col],NN[n]].filter(Boolean).join(' · ');return{n,col,tag,mult:Math.round(CM[col]*[1,1,1.4,3.5][n]*10)/10,stat:`${n} slash${n>1?'es':''}, ${col==='neon'?'pink and cyan':CN[col]}`}},
  make(p,F){const I=this.info(p),g=geo(F),r=mulberry(seedOf(p,'noirpos')),k=seedOf(p,'noir')%907;const PAL={neon:[H('#ff2a8a'),H('#20e0ff')],red:[H('#ff1a1a'),H('#ff7a5a')],gold:[H('#ffc83a'),H('#fff1b0')]}[I.col];
    const sl=Array.from({length:I.n},(_,i)=>{const a=-.9+r()*.5;return{ca:Math.cos(a),sa:Math.sin(a),cx:F.x0+g.W*(.3+r()*.4),cy:F.y0+(i+.5)*(g.Hh/I.n),L:Math.min(80+r()*60,g.W*.42),W:Math.min(6+r()*5,g.Hh/(I.n*2.6)),col:PAL[i%2]}});
    const fx=F.x0+r()*g.W,fy=F.y0+r()*g.Hh*.5,shards=Array.from({length:3},()=>({a:r()*6.283,o:(r()-.5)*g.Hh*.7}));
    return(x,y)=>{let c=grad([H('#1a0c33'),H('#0e0820'),H('#060509')],cl01((y-F.y0)/g.Hh));
      c=add3(c,PAL[0],.18*Math.exp(-Math.hypot(x-fx,y-fy)/90));
      for(const s of shards){const d=(x-g.cx)*Math.cos(s.a)+(y-g.cy)*Math.sin(s.a)-s.o;if(d>0){c=mix(c,H('#1b1530'),.55);if(d<1.6)c=mix(c,PAL[1],.6)}}
      const an=Math.atan2(y-fy,x-fx);if(hash2(Math.floor(an*90),0,k)>.82&&Math.hypot(x-fx,y-fy)>30)c=mix(c,WHT,.07);
      const gg=1-Math.hypot(x-fx,y-fy)/210,hx_=Math.floor(x/7)*7+3.5,hy_=Math.floor(y/7)*7+3.5,rad=cl01(gg)*3.6;if(rad>.3)c=paint(c,mix(c,PAL[0],.45),rad-Math.hypot(x-hx_,y-hy_));
      const col=Math.floor(x/16),top=F.y1-g.Hh*(.1+hash2(col,1,k)*.2);if(y>top){c=H('#07060c');if(Math.abs(y-top)<1.2)c=mix(c,PAL[1],.5);
        const wx=((x%16)+16)%16,wy=((y-top)%9+9)%9;if(wx>3&&wx<6&&wy>3&&wy<6&&hash2(col,Math.floor((y-top)/9),k+2)>.62)c=mix(PAL[hash2(col,Math.floor(y/9),k)>.5?0:1],WHT,.3)}
      for(const s of sl){const dx=x-s.cx,dy=y-s.cy,u=dx*s.ca+dy*s.sa,v=-dx*s.sa+dy*s.ca,t=cl01((u+s.L)/(2*s.L)),w=s.W*Math.sin(Math.PI*t);
        const d=Math.abs(v)-w;if(Math.abs(u)<s.L+20)c=add3(c,s.col,.55*Math.exp(-Math.max(0,d)/9)*(Math.abs(u)<s.L?1:Math.exp(-(Math.abs(u)-s.L)/6)));
        if(Math.abs(u)<s.L){c=paint(c,BLK,w+3-Math.abs(v-4));c=paint(c,s.col,w-Math.abs(v));c=paint(c,mix(s.col,WHT,.85),w*.35-Math.abs(v+w*.2))}}
      if(hash2(x|0,y|0,k+5)>.9985)c=mix(c,PAL[1],.9);
      return clamp3(c)}}};

/* ---------- BUBBLE BOMB ---------- */
S.bomb={name:'Bubble Bomb',
  info(p){const h=hseed(p,'bomb'),e=h<.015?3:h<.07?2:h<.25?1:0,g=hseed(p,'bombG')<.03;const EN=['','Peeper','Watcher','Third Eye'][e],EM=[1,1.3,2.5,8][e];
    return{e,g,tag:[g?'Gold Bomb':'',EN].filter(Boolean).join(' · '),mult:Math.round((g?4:1)*EM*10)/10,stat:(e?`${e} eye${e>1?'s':''}`:'No eyes')+(g?', gold':'')}},
  make(p,F){const I=this.info(p),g=geo(F),r=mulberry(seedOf(p,'bombpos')),k=seedOf(p,'bomb')%977,sR=Math.max(.5,Math.min(1,g.Hh/170));

function bbox(d){const n=d.match(/-?[\d.]+/g).map(Number);let a=1e9,b=1e9,c=-1e9,e=-1e9;for(let i=0;i+1<n.length;i+=2){a=Math.min(a,n[i]);c=Math.max(c,n[i]);b=Math.min(b,n[i+1]);e=Math.max(e,n[i+1])}return[a,b,c,e]}
function prepWeap(w){if(w._p)return;w._p=w.parts.map(([m,d])=>({m,p:new Path2D(d),b:bbox(d)}));w._h=(w.holes||[]).map(d=>new Path2D(d));
  w._a=(w.after||[]).map(([m,d])=>({m,p:new Path2D(d),b:bbox(d)}));const D=w.det||{};w._l=(D.lines||[]).map(d=>new Path2D(d));w._s=(D.slots||[]).map(s=>new Path2D(s[0]));
  w._st=(w.stitch||[]).map(d=>new Path2D(d));w._f=D.fuller?new Path2D(D.fuller):null;w._bv=D.bevel?new Path2D(D.bevel):null;
  w._sil=new Path2D();w._p.forEach(q=>w._sil.addPath(q.p));(w.rings||[]).forEach(([cx,cy,R])=>{w._sil.moveTo(cx+R,cy);w._sil.arc(cx,cy,R,0,6.2832)})}

/* ---------- finishes: every pixel function works in weapon units (240 wide) ----------
   Like the real game, each finish is ONE fixed texture sheet. The pattern index (0-999) only
   decides where that sheet sits on the weapon (offset + rotation), so the same pattern on
   the same model always looks identical, and some placements are rarer than others. */
let _fbmQ=null;   // fbm value quantiles, so "30% blue" really means ~30% of the sheet
function fbmQuant(p){if(!_fbmQ){const a=[];const r=mulberry(99);for(let i=0;i<8000;i++){const x=r()*700,y=r()*700,w=fbm(x/48,y/48,TEMPER_K+7,2)*24;a.push(fbm((x+w)/32,(y-w)/32,TEMPER_K,4))}a.sort((x,y)=>x-y);_fbmQ=a}
  return _fbmQ[Math.max(0,Math.min(_fbmQ.length-1,Math.floor(p*_fbmQ.length)))]}
const TEMPER_K=4242;let _T=null;
function temperSheet(){return _T||(_T={tb:fbmQuant(.3),tp:fbmQuant(.42),tg:fbmQuant(.68)})}
function temperClass(x,y){const T=temperSheet(),w=fbm(x/48,y/48,TEMPER_K+7,2)*24,n=fbm((x+w)/32,(y-w)/32,TEMPER_K,4);
  return n<T.tb?0:n<T.tp?1:n<T.tg?2:3}
/* how far each finish is allowed to rotate (radians); stripes, pixels and fades stay square */
const ROT={tempered:6.283,camo:6.283,solid:3.14,lava:6.283,frost:6.283,plasma:6.283,splat:6.283,gold:6.283,nebula:6.283,gamma:6.283,sovereign:6.283,hellfire:.3,
  marble:.5,damascus:.12,tiger:.22,hydro:.3,fade:.05};
function placement(fin,p){const r=mulberry(seedOf(p,fin)*3+17);const tx=r()*512,ty=r()*512,ro=(r()-.5)*(ROT[fin]||0);
  return fin==='fade'||fin==='web'||SCENES[fin]?{tx:0,ty:0,rot:SCENES[fin]?0:ro}:{tx,ty,rot:ro}}
function placePt(L,X,Y){const c=Math.cos(L.rot),s=Math.sin(L.rot),dx=X-120,dy=Y-48;return[c*dx-s*dy+120+L.tx,s*dx+c*dy+48+L.ty]}

/* points sampled across a model's painted parts, so blue % is measured on what you actually see */
function flatten(d){const t=d.match(/[MLCQZ]|-?[\d.]+/g),pts=[];let i=0,cx=0,cy=0,cmd='';const num=()=>+t[i++];
  while(i<t.length){if(/[MLCQZ]/.test(t[i]))cmd=t[i++];
    if(cmd==='M'||cmd==='L'){cx=num();cy=num();pts.push([cx,cy])}
    else if(cmd==='C'){const a=num(),b=num(),c=num(),e=num(),x=num(),y=num();for(let k=1;k<=8;k++){const u=k/8,v=1-u;pts.push([v*v*v*cx+3*v*v*u*a+3*v*u*u*c+u*u*u*x,v*v*v*cy+3*v*v*u*b+3*v*u*u*e+u*u*u*y])}cx=x;cy=y}
    else if(cmd==='Q'){const a=num(),b=num(),x=num(),y=num();for(let k=1;k<=6;k++){const u=k/6,v=1-u;pts.push([v*v*cx+2*v*u*a+u*u*x,v*v*cy+2*v*u*b+u*u*y])}cx=x;cy=y}
    else if(cmd==='Z'){}else i++}
  return pts}
function inPoly(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[e,f]=P[j];if((b>y)!==(f>y)&&x<(e-a)*(y-b)/(f-b)+a)c=!c}return c}
const SAMP={};
function skinSamples(w){if(SAMP[w])return SAMP[w];const polys=WEAP[w].parts.filter(q=>q[0]==='skin').map(q=>flatten(q[1]));const out=[];
  polys.forEach(P=>{let a=1e9,b=1e9,c=-1e9,e=-1e9;P.forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);e=Math.max(e,y)});
    for(let y=b+1;y<e;y+=3)for(let x=a+1;x<c;x+=3)if(inPoly(P,x,y))out.push([x,y])});return SAMP[w]=out}
const tmCache={};
function temperMeta(w,p){const key=w+p;if(tmCache[key])return tmCache[key];const L=placement('tempered',p),pts=skinSamples(w);let c=[0,0,0,0];
  pts.forEach(([x,y])=>{const q=placePt(L,x,y);c[temperClass(q[0],q[1])]++});const n=pts.length||1;
  return tmCache[key]={blue:c[0]/n,purple:c[1]/n,gold:c[2]/n}}
const TRANK={};   // every pattern on a model, ranked by blue and by gold
function temperRank(w){if(TRANK[w])return TRANK[w];const all=[...Array(1000).keys()].map(p=>({p,...temperMeta(w,p)}));
  const blue=new Array(1000),gold=new Array(1000);all.slice().sort((a,b)=>b.blue-a.blue).forEach((o,i)=>blue[o.p]=i);all.slice().sort((a,b)=>b.gold-a.gold).forEach((o,i)=>gold[o.p]=i);
  return TRANK[w]={blue,gold}}

   Real-style drop odds per rarity. Every skin's value is set so that, averaged over every
   float it can roll, every pattern it can land and the StatTrak chance, each case pays back
   exactly 97% of its price. Values are worked out lazily the first time a skin is needed. */

const COND=[[.07,'Factory New','FN',1.5],[.15,'Minimal Wear','MW',1.12],[.38,'Field-Tested','FT',.92],[.45,'Well-Worn','WW',.8],[1.0001,'Battle-Scarred','BS',.72]];

  if(fin==='nebula')P=A.filter(p=>nebulaPhase(p)===6);else if(fin==='gamma')P=A.filter(p=>gammaPhase(p)===4);
  else if(fin==='fade')P=A.slice().sort((a,b)=>fadePct(b)-fadePct(a)).slice(0,5);else if(fin==='marble')P=A.filter(p=>marbleType(p)==='fi');

/* ---------- skin registry ---------- */
const SK={};
function fr(fin){return KNIFE_FIN[fin]?KNIFE_FIN[fin].fr:fin==='gold'?[0,.2]:[0,1]}
function caseProbs(C){if(C.sp)return C.contra?[0,0,0,0,.99,.01]:[0,0,0,0,1,0];return C.contra?[PROB[0]-PROB_CONTRA,...PROB.slice(1),PROB_CONTRA]:[...PROB,0]}
CASES.forEach((C,ci)=>{C.ci=ci;C.skins=[[],[],[],[],[],[]];C.tp=caseProbs(C);
  const top=C.contra?5:4,ev=x=>{const T=TMUL_BASE.slice();T[0]=x;let e=0;for(let t=0;t<=top;t++)e+=C.tp[t]*T[t]+(t<top?OD_P*C.tp[t]*(T[t+1]-T[t]):0);return e};
  const a=ev(0),b=ev(1)-a,T=TMUL_BASE.slice();T[0]=(RTP-a)/b;C.tmul=T;
  // knife and glove crates: every pull is a Special, so the Special tier carries the whole 97%
  if(C.sp){T[0]=0;T[5]=C.contra?10:0;T[4]=(RTP-C.tp[5]*T[5])/C.tp[4]}
  const add=(sk,w,list)=>{sk.ci=ci;sk.wt=w;SK[sk.id]=sk;list.push(sk)};
  C.t.forEach((list,t)=>{list.forEach(([w,fin,n,P],i)=>add({id:`${C.id}.${t}.${i}`,t,w,fin,P,name:WEAP[w].name,skin:n,fr:fr(fin)},.7+((i*37+t*11+ci*5)%9)/9,C.skins[t]))});
  C.knives.forEach(k=>C.kf.forEach(f=>{const kf=KNIFE_FIN[f];add({id:`${C.id}.K.${k}.${f}`,t:4,w:k,fin:f,P:kf.P||[],name:'★ '+WEAP[k].name,skin:kf.n,fr:kf.fr,knife:1},KW[k]*KFW[f],C.skins[4])}));
  (C.gloves||[]).forEach(([g,f])=>{const gf=GLOVE_FIN[f];add({id:`${C.id}.G.${g}.${f}`,t:4,w:g,fin:gf.fin,P:gf.P,name:'★ '+WEAP[g].name,skin:gf.n,fr:[.06,.8],glove:1},GW[g],C.skins[4])});
  (C.contra||[]).forEach(([w,f,n],i)=>{const kn=WEAP[w].knife;add({id:`${C.id}.X.${i}`,t:5,w,fin:f,P:[],name:(kn?'★ ':'')+WEAP[w].name,skin:n,fr:KNIFE_FIN[f].fr,knife:kn},1,C.skins[5])});
  C.skins.forEach(L=>{const mw=L.reduce((a,s)=>a+s.wt,0)/(L.length||1);L.forEach(s=>s.rel=s.wt/mw)})});
/* Black Market: a timed crate that only holds Elite and up from every case, with 25x the
   Contraband odds. Priced so it still returns 97% on average. */
(()=>{const src=CASES.filter(C=>!C.free),BM={id:'blackmarket',name:'Black Market Crate',bm:1,lvl:15,col:['#ff2a2a','#0a0000','#ffd0d0'],ci:CASES.length,
  tp:[0,0,.55,.35,.095,.005],skins:[[],[],[],[],[],[]],t:[]};
  src.forEach(C=>C.skins.forEach((L,t)=>{if(t>=2)BM.skins[t].push(...L)}));
  let ev=0;for(let t=2;t<=5;t++){const L=BM.skins[t];ev+=BM.tp[t]*L.reduce((a,sk)=>a+CASES[sk.ci].price*CASES[sk.ci].tmul[t]*sk.rel,0)/L.length}
  BM.price=Math.round(ev/RTP);BM.ev=ev;CASES.push(BM)})();
function baseOf(sk){if(sk._b==null){const C=CASES[sk.ci];sk._b=C.price*C.tmul[sk.t]*sk.rel/(eCond(sk.fr[0],sk.fr[1])*ePat(sk)*E_ST*E_VAR)}return sk._b}
/* ---------- living prices ----------
   Every skin's price drifts on its own slow waves (they average out to 1, so cases still return 97%).
   One case is vaulted each week: it can't be opened, and its skins climb while it's away. */
const PRICE_STEP=6*3600e3;
const priceTick=()=>Math.floor(Date.now()/PRICE_STEP);
const VAULTABLE=()=>CASES.filter(C=>!C.free&&!C.bm&&!C.secret);
function vaultedAt(tick){const wk=Math.floor(tick/28),L=VAULTABLE();return{c:L[strSeed('vault'+wk)%L.length],day:(tick%28)/4}}
function priceMult(sk,tick){if(tick==null)tick=priceTick();const h=strSeed(sk.id),a=(h%1000)/1000*6.283,b=((h>>>10)%1000)/1000*6.283,d=tick/4;
  let m=1+.09*Math.sin(d/6+a)+.04*Math.sin(d/2.3+b);const v=vaultedAt(tick);if(v.c&&v.c.ci===sk.ci)m*=1+.035*v.day;return m}
function priceHistory(sk,n=112){const t=priceTick();return Array.from({length:n},(_,i)=>priceMult(sk,t-n+1+i))}
function valueOf(it){const sk=SK[it.s];return Math.max(.03,Math.round(priceMult(sk)*baseOf(sk)*condOf(it.f)[3]*floatMult(it.f)*patInfo(sk,it.p).mult*(it.st?ST_M:1)*(it.pr?PR_M:1)*(it.mp?MP_M:1)*(it.fe?FE_M:1)*ooMult(it,sk)*100)/100)}
const FE_M=1.25;
/* Original owner: a Special you unboxed yourself gains 1% a day you hold it, up to 10% */
const ooMult=(it,sk)=>it.oo&&sk.t>=4?1+Math.min(.1,Math.max(0,(Date.now()-it.oo)/864e5)*.01):1;
let _uid=Date.now()%1e7;
function makeItem(sk,raw,p,st){const it={id:++_uid,s:sk.id,f:sk.fr[0]+raw*(sk.fr[1]-sk.fr[0]),p:p==null?Math.floor(Math.random()*1000):p,st:!!st,c:sk.ci};

  if(items.some(it=>!!it.st!==!!items[0].st))return'Don\'t mix StatTrak and normal items';

  if(wp.knife){const b=bladeBox(w);pts=[[b.cx,b.cy]]}
  else{const polys=wp.parts.filter(q=>q[0]==='skin').map(q=>flatten(q[1])).map(P=>{const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);return{P,x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}}).sort((a,b)=>(b.x1-b.x0)*(b.y1-b.y0)-(a.x1-a.x0)*(a.y1-a.y0));
    const m=polys[0];pts=[.18,.4,.62,.84].map(f=>{const x=m.x0+(m.x1-m.x0)*f;let ys=[];for(let y=m.y0;y<=m.y1;y+=.5)if(inPoly(m.P,x,y))ys.push(y);return[x,ys.length?(ys[0]+ys[ys.length-1])/2:(m.y0+m.y1)/2]})}
  return _slots[w]=pts.map(([x,y])=>{if(wp.knife){const dx=x-122,dy=y-50,c=Math.cos(-.34),s=Math.sin(-.34);x=120+.93*(c*dx-s*dy);y=49+.93*(s*dx+c*dy)}return[x/240*100,y/96*100]})}

    const idx=Math.floor((x+center)/step);if(idx!==last){last=idx;if(tick&&t<1)A.tick(Math.pow(1-t,3)*1.4);const c=cols[idx];if(c){el.style.setProperty('--glow',c);if(stage)stage.style.setProperty('--glow',c.trim()?`color-mix(in srgb,${c} 30%,transparent)`:'')}}

   ${pi.rank?`<div class="rank">${pi.rank}</div>`:''}
   <div class="flt"><div class="b"><i></i><i></i><i></i><i></i><i></i></div><div class="m"><span style="left:${it.f*100}%"></span></div>
     <div class="sl">${COND.map(c=>`<i class="${c===cd?'on':''}">${c[2]}</i>`).join('')}</div><div class="t">Float <b>${it.f.toFixed(8)}</b></div></div>
   <div class="val" data-v="${it.v}">${money(it.v)}</div>

function tiltable(root){const sh=root.querySelector('.shine');if(!sh)return;const inn=sh.querySelector('.in'),gl=sh.querySelector('.gl');
  sh.addEventListener('pointermove',e=>{const r=sh.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;inn.style.transform=`rotateY(${px*26}deg) rotateX(${-py*22}deg)`;gl.classList.remove('auto');gl.style.setProperty('--sx',(50+px*120)+'%')});
  sh.addEventListener('pointerleave',()=>{inn.style.transform='';gl.classList.add('auto')})}
function countUp(el){const v=+el.dataset.v,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/900),e=1-Math.pow(1-k,3);el.textContent=money(v*e);if(k<1)requestAnimationFrame(f)})(t0)}
/* ---------- selling, with undo ---------- */
let lastSale=null;
function releaseCharm(it){if(it&&it.charm){S.charms.push(it.charm);delete it.charm}}
function removeItems(list){const ids=new Set(list.map(i=>i.id));list.forEach(releaseCharm);S.items=S.items.filter(i=>!ids.has(i.id));
  S.cab=(S.cab||[]).filter(id=>!ids.has(id));if(S.equip&&ids.has(S.equip))S.equip=null}
function undoToast(label,v){const e=document.createElement('div');e.className='toast undo';e.innerHTML=`<span>${esc(label)}</span><b>+${money(v)}</b><button>Undo</button>`;$('toasts').appendChild(e);
  e.querySelector('button').onclick=()=>{if(!lastSale||lastSale.el!==e)return;const L=lastSale;lastSale=null;
    if(!spend(L.v)){toast('Not enough balance to undo','',1);return}L.items.forEach(it=>{if(it._ch){it.charm=it._ch;S.charms=S.charms.filter(c=>c.id!==it._ch.id)}delete it._ch;S.items.push(it)});save();A.nav();e.remove();toast('Sale undone','',1);
    if(view==='stash')drawStash();if(view==='upg')drawUpg()};
  setTimeout(()=>{e.remove();if(lastSale&&lastSale.el===e)lastSale=null},5200);return e}
function sellList(list,label){list=list.filter(it=>S.items.includes(it));if(!list.length)return 0;const v=list.reduce((a,it)=>a+it.v,0);list.forEach(it=>{if(it.charm)it._ch=it.charm});
  removeItems(list);credit(v);ev('sell',{v});save();A.sell();lastSale={items:list,v};lastSale.el=undoToast(label||('Sold '+(list.length===1?fullName(list[0]):list.length+' items')),v);return v}
const sellItem=it=>sellList([it])>0;

function toUpgrader(it){if(S.lvl<UNLOCK.upg){toast(`Reach level ${UNLOCK.upg} to unlock the Upgrader`,'',1);return}if(it.lk){toast('Unlock this item first','',1);return}

/* ---------- price sparkline ---------- */
function spark(sk){const h=priceHistory(sk),mn=Math.min(...h),mx=Math.max(...h),W=300,H=54,pts=h.map((v,i)=>`${(i/(h.length-1)*W).toFixed(1)},${(H-4-(v-mn)/(mx-mn||1)*(H-8)).toFixed(1)}`).join(' ');
  const ch=(h[h.length-1]/h[h.length-5]-1)*100,up=ch>=0;
  return `<div class="spark"><div class="sh"><span class="sub">Price, last 4 weeks</span><b class="${up?'up':'dn'}">${up?'+':''}${ch.toFixed(1)}% today</b></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up?'#4cd964':'#ff5a52'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`}

/* ---------- inspect: everything you can do with one item ---------- */
const MOVES={butterfly:'mv-flipout',karambit:'mv-spin',talon:'mv-spin',flip:'mv-snap',navaja:'mv-snap',nomad:'mv-snap',ursus:'mv-snap',shadow:'mv-push'};
const moveOf=w=>WEAP[w].knife?(MOVES[w]||'mv-toss'):WEAP[w].glove?'mv-flex':'mv-tilt';
function inspect(it,onSold){const sk=SK[it.s],isEq=S.equip===it.id,pinned=(S.cab||[]).includes(it.id);
  const {m,close}=modal(revealHTML(it,{sell:false})+spark(sk)+
   `${it.st&&sk.t>=4?`<p class="sub" style="text-align:center;margin-top:6px">StatTrak™ upgrades won: <b>${it.stu||0}</b>${isEq?' (equipped)':''}</p>`:''}
    ${histHTML(it)}
    <div class="ibar"><button class="btn" data-a="move">Inspect move</button><button class="btn" data-a="tilt">Tilt to inspect</button>
     <button class="btn" data-a="lock">${it.lk?'Unlock':'Lock'}</button><button class="btn" data-a="pin">${pinned?'Unpin from cabinet':'Pin to cabinet'}</button>
     ${it.st&&sk.t>=4?`<button class="btn" data-a="equip">${isEq?'Unequip':'Equip StatTrak'}</button>`:''}</div>
    <div class="btns"><button class="btn pri" data-a="sell" ${it.lk?'disabled':''}>Sell for ${money(it.v)}</button><button class="btn" data-a="upg" ${it.lk?'disabled':''}>Upgrade this</button></div>`);
  tiltable(m);const redo=()=>{close();inspect(it,onSold);if(view==='stash')drawStash();if(view==='cases')drawShop()};
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='sell'){if(sellItem(it)){close();onSold&&onSold();if(view==='stash')drawStash();if(view==='cases')drawShop()}}
    if(a==='upg'){close();toUpgrader(it)}
    if(a==='lock'){it.lk=it.lk?0:1;save();redo()}
    if(a==='pin'){S.cab=S.cab||[];if(pinned)S.cab=S.cab.filter(x=>x!==it.id);else{if(S.cab.length>=6){toast('Your cabinet holds 6. Unpin one first.','',1);return}S.cab.push(it.id)}save();redo()}
    if(a==='equip'){S.equip=isEq?null:it.id;save();redo()}
    if(a==='uncharm'){releaseCharm(it);save();A.nav();redo()}
    if(a==='charm'){if(!S.charms.length){toast('No charms yet. Open a Charm Capsule in the Stash tab.','',1);return}pickCharm(c=>{S.charms=S.charms.filter(x=>x.id!==c.id);it.charm=c;save();A.ach();redo()})}
    if(a==='move'){const inn=m.querySelector('.shine .in'),cl=moveOf(sk.w);inn.classList.remove(cl);void inn.offsetWidth;inn.classList.add(cl);A.whoosh()}
    if(a==='tilt')startTilt(m)})}
function pickCharm(cb){const {m,close}=modal(`<h2>Pick a charm</h2><div class="chgrid">${S.charms.slice().sort((a,b)=>b.v-a.v).map(c=>`<button class="chcard r${charmById(c.cid)[2]}" data-c="${c.id}">${charmSVG(c)}<b>${charmById(c.cid)[1]}</b><span class="sub">${money(c.v)}</span></button>`).join('')}</div>`);
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=S.charms.find(x=>x.id==b.dataset.c);close();cb(c)})}
/* tilt your phone to turn the item; the charm swings the other way */
function startTilt(m){const go=()=>{const inn=m.querySelector('.shine .in'),gl=m.querySelector('.shine .gl'),chm=m.querySelector('.chm');gl&&gl.classList.remove('auto');
    const f=e=>{if(!document.body.contains(m)){removeEventListener('deviceorientation',f);return}const g=Math.max(-40,Math.min(40,e.gamma||0)),b=Math.max(-40,Math.min(40,(e.beta||45)-45));
      inn.style.transform=`rotateY(${g*.9}deg) rotateX(${-b*.6}deg)`;if(gl)gl.style.setProperty('--sx',(50+g*2.6)+'%');if(chm)chm.style.setProperty('--sw',(-g*.9)+'deg')};
    addEventListener('deviceorientation',f);toast('Tilt your phone','',1)};
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(r=>r==='granted'?go():toast('Motion access was declined','',1)).catch(()=>toast('Motion access is not available here','',1));
  else if('DeviceOrientationEvent' in window)go();else toast('This device has no tilt sensor. Drag over the item instead.','',1)}

/* ================= STASH, MARKET, CHARMS ================= */
let sortBy='value',stTab='stash',stF={t:'',w:'',st:0,q:'',ed:''},selMode=false,selSet=new Set();
function sorted(list){list=list.slice();if(sortBy==='value')list.sort((a,b)=>b.v-a.v);else if(sortBy==='new')list.sort((a,b)=>b.id-a.id);else list.sort((a,b)=>tierOf(b)-tierOf(a)||b.v-a.v);return list}
const stSeg=()=>`<div class="seg ptab" id="stTab"><button data-t="stash" class="${stTab==='stash'?'on':''}">Stash</button><button data-t="market" class="${stTab==='market'?'on':''}">Market</button></div>`;
const wireStSeg=()=>$('stTab').querySelectorAll('button').forEach(b=>b.onclick=()=>{stTab=b.dataset.t;selMode=false;selSet.clear();drawStash()});
/* editions: Prismatic, Misprint, Grail, Contraband and pattern gems */
const EDS=[['any','Any edition'],['pr','Prismatic'],['mp','Misprint'],['grail','Grail'],['contra','Contraband'],['gem','Pattern gems']];
function edMatch(it,k){if(!k)return true;const sk=SK[it.s],pi=patInfo(sk,it.p);
  if(k==='pr')return!!it.pr;if(k==='mp')return!!it.mp;if(k==='grail')return!!pi.grail;if(k==='contra')return sk.t===5;if(k==='gem')return pi.gem>0&&!pi.grail;
  return!!(it.pr||it.mp||pi.grail||sk.t===5||pi.gem>0)}
function filtered(){const q=stF.q.trim().toLowerCase();return sorted(S.items).filter(it=>{const sk=SK[it.s];if(!edMatch(it,stF.ed))return false;
  return(stF.t===''||sk.t===+stF.t)&&(!stF.w||sk.w===stF.w)&&(!stF.st||it.st)&&(!q||(sk.name+' '+sk.skin).toLowerCase().includes(q))})}
function drawStash(){const y=scrollY;drawStashInner();scrollTo(0,y)}
function drawStashInner(){if(stTab!=='stash'&&stTab!=='market')stTab='stash';if(stTab==='market')return drawMarket();
  const tv=S.items.reduce((a,it)=>a+it.v,0),list=filtered(),models=[...new Set(S.items.map(it=>SK[it.s].w))];

    <select id="sort" aria-label="Sort"><option value="value">Highest value</option><option value="new">Newest</option><option value="rar">Rarity</option></select></div>
   <div class="filters sfil"><input id="sq" type="search" placeholder="Search" value="${esc(stF.q)}" aria-label="Search">
     <select id="sfT" aria-label="Rarity"><option value="">Any rarity</option>${TIERS.map((T,i)=>`<option value="${i}" ${stF.t===''+i?'selected':''}>${i===4?'★ Special':T.n}</option>`).join('')}</select>
     <select id="sfW" aria-label="Model"><option value="">Any model</option>${models.map(w=>`<option value="${w}" ${stF.w===w?'selected':''}>${WEAP[w].name}</option>`).join('')}</select>
     <select id="sfE" aria-label="Edition"><option value="">All items</option>${EDS.map(([k,n])=>`<option value="${k}" ${stF.ed===k?'selected':''}>${n}</option>`).join('')}</select>
     <button class="tog${stF.st?' on':''}" id="sfS"><i></i>StatTrak</button></div>
   ${stF.ed?`<p class="sub edcount">${list.length} edition item${list.length===1?'':'s'}, worth <b>${money(list.reduce((a,i)=>a+i.v,0))}</b></p>`:''}
   <div class="filters"><button class="btn sm${selMode?' on':''}" id="selm">${selMode?'Done selecting':'Select'}</button><button class="btn sm" id="sellunder">Sell under…</button><button class="btn sm" id="sellcheap">Sell Standard</button><button class="btn sm" id="sellall">Sell all</button></div>
   ${list.length?(()=>{const P=pageOf('stash',list);return `<div class="sgrid">${P.shown.map(it=>`<div data-id="${it.id}">${tileHTML(it,{val:money(it.v),cls:selSet.has(it.id)?'sel':''})}</div>`).join('')}</div>${moreBtn('stash',P.more)}`})():`<div class="empty">${S.items.length?'Nothing matches those filters.':'Nothing here yet. Open a case and your items land here.'}</div>`}
   ${selMode?`<div class="upbar selbar"><div><small>${selSet.size} selected</small><b>${money(selV)}</b></div><button class="btn" id="selupg" ${selSet.size&&selSet.size<=6?'':'disabled'}>Upgrade</button><button class="btn pri" id="selsell" ${selSet.size?'':'disabled'}>Sell</button></div>`:''}`;

  const confirmSell=(items,label)=>{items=items.filter(it=>!it.lk);if(!items.length){toast('Nothing to sell. Locked items are skipped.','',1);return}const v=items.reduce((a,it)=>a+it.v,0);
    const {m,close}=modal(`<h2>${label}?</h2><p class="sub" style="margin:8px 0 4px">${items.length} items for <b>${money(v)}</b>. Locked items are skipped. You can undo for 5 seconds.</p><div class="btns"><button class="btn pri" id="yes">${label}</button><button class="btn" id="no">Cancel</button></div>`);
    m.querySelector('#no').onclick=close;m.querySelector('#yes').onclick=()=>{sellList(items,label);close();selSet.clear();drawStash()}};
  $('sellall').onclick=()=>confirmSell(S.items.slice(),'Sell all');
  $('sellcheap').onclick=()=>confirmSell(S.items.filter(it=>tierOf(it)===0),'Sell Standard items');

/* market: bot listings that refresh every 15 minutes */
const mkLeft=()=>{const s=Math.max(0,((mkTick()+1)*MK_STEP-Date.now())/1000|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};
let mkCache=null;
function listings(){const t=mkTick();if(!mkCache||mkCache.t!==t||mkCache.l!==S.lvl)mkCache={t,l:S.lvl,list:withDet(marketListings(t,S.lvl),t)};S.mkBought=S.mkBought&&S.mkBought.t===t?S.mkBought:{t,ids:[]};return mkCache.list.filter(x=>!S.mkBought.ids.includes(x.id))}
function drawMarket(){const L=listings();
  $('v-stash').innerHTML=`${stSeg()}<div class="shead"><h2>Market</h2><div class="tot">New listings in <b data-mkcd>${mkLeft()}</b></div></div>
   <p class="sub" style="margin:-4px 0 12px">Bots price on the skin and wear. They don't check patterns or tiny floats, so look closely.</p>${detHint()}
   ${L.length?`<div class="sgrid">${L.map(x=>`<div data-m="${x.id}">${tileHTML(Object.assign({},x),{val:money(x.price),cls:'mk',hide:1})}</div>`).join('')}</div>`:'<div class="empty">Sold out. New listings soon.</div>'}`;
  wireStSeg();$('v-stash').querySelectorAll('[data-m]').forEach(d=>d.onclick=()=>listingModal(L.find(x=>x.id===d.dataset.m)))}
function listingModal(x){const sk=SK[x.s],cd=condOf(x.f),im=itemImg(x,560);
  const {m,close}=modal(`<div class="reveal r${sk.t}"><div class="shine"><div class="in"><img src="${im}" alt=""><div class="gl auto" style="-webkit-mask-image:url(${im});mask-image:url(${im})"></div></div></div>
    <div class="rname">${esc(fullName(x))}<small>${tierName(sk.t)}, ${cd[1]}</small></div>
    <div class="chips"><span class="chip">Pattern ${x.p}</span><span class="chip">Float ${x.f.toFixed(6)}</span><span class="chip">Seller: ${x.seller}</span></div>
    <div class="val">${money(x.price)}</div><p class="sub">You'll see what it's really worth once it's yours.</p>
    <div class="btns"><button class="btn pri" id="buy">Buy for ${money(x.price)}</button><button class="btn" id="no">Leave it</button></div></div>`);
  tiltable(m);m.querySelector('#no').onclick=close;
  m.querySelector('#buy').onclick=()=>{if(!spend(x.price)){A.err();toast('Not enough balance','Top up',1);return}S.mkBought.ids.push(x.id);
    const it={id:++_uid,s:x.s,f:x.f,p:x.p,st:x.st,c:x.c};it.v=valueOf(it);setOrigin(`Bought on the market from ${x.seller} for ${money(x.price)}`);gotItem(it);setOrigin();if(x.det&&patInfo(SK[it.s],it.p).gem>0)S.detHit=1;ev('aucW');save();close();const d=it.v-x.price;if(d>x.price*.5)S.sniped=1;

S.sup=S.sup||{};S.fe=S.fe||{};S.forged=S.forged||[];

function gemPs(sk){if(gemCache[sk.id])return gemCache[sk.id];const g=grailOf(sk),L=[];for(let p=0;p<1000;p++){if(p!==g&&patBase(sk,p).gem>0)L.push(p)}return gemCache[sk.id]=L}
function supOf(sk){let s=S.sup[sk.id];if(s)return s;const h=strSeed(sk.id+'sup'),n=2+h%4,taken=Math.min(n-1,(h>>>5)%3);

    if(dz&&S.rival)rivalAdd(grailItem(sk,i+1,n))}

/* ================= PATTERN DETECTIVE =================
   Some market rounds have one mislabelled gem: the seller priced it as plain.
   Your only clues are the pattern number and the float. Dazza snipes it if you're slow. */
function detListing(t){const r=mulberry(t*131+71);if(r()>.42)return null;const pool=VAULTABLE().filter(C=>C.lvl<=S.lvl&&C.skins[4].length);if(!pool.length)return null;
  for(let k=0;k<12;k++){const C=pool[Math.floor(r()*pool.length)],L=C.skins[4].filter(s=>!s.glove),sk=L[Math.floor(r()*L.length)];if(!sk)continue;const G=gemPs(sk);if(!G.length)continue;
    const it={id:'d'+t,s:sk.id,f:sk.fr[0]+r()*(sk.fr[1]-sk.fr[0]),p:G[Math.floor(r()*G.length)],st:false,c:sk.ci,det:1};it.v=valueOf(it);
    it.price=Math.round(naiveValue(it)*(.95+r()*.2)*100)/100;it.seller=BOTS.filter(b=>b!=='Dazza')[Math.floor(r()*(BOTS.length-1))];
    it.snipeAt=t*MK_STEP+(3+r()*8)*60e3;return it}return null}
function withDet(list,t){const d=detListing(t);if(!d)return list;const out=list.slice(),i=Math.floor(mulberry(t*17+3)()*(out.length+1));out.splice(i,0,d);return out}
function detLive(){const t=mkTick(),L=listings();return L.find(x=>x.det)}
const detHint=()=>{const d=detLive();return d?`<p class="dhint"><span class="gdot"></span>Dazza's been circling. One listing here is a mislabelled gem. Check the pattern numbers.</p>`:''};
function rivalTick(){if(!S.rival)return;const t=mkTick(),d=detListing(t);if(!d||S.rival.snT===t||Date.now()<d.snipeAt)return;
  S.rival.snT=t;listings();if(S.mkBought.ids.includes(d.id))return;S.mkBought.ids.push(d.id);
  const it=Object.assign({},d,{id:++_uid,h:[[Date.now(),`Sniped off the market by Dazza for ${money(d.price)}`]]});delete it.price;delete it.det;delete it.seller;delete it.snipeAt;it.v=valueOf(it);rivalAdd(it);save();
  const pi=patInfo(SK[it.s],it.p);if(!busy)toast(`Dazza sniped a mislabelled ${pi.tag||'gem'}`,`${fullName(it)}, pattern ${it.p}. Paid ${money(d.price)}, worth ${money(it.v)}.`,1);
  pushTicker(it,'Dazza');if(view==='stash'&&stTab==='market'&&!document.querySelector('.modal'))drawStash()}

/* ---------- Scratchie Seeds: buy a knife with a hidden pattern, scratch the 3 digits ---------- */
const SEEDFIN=['tempered','nebula','gamma','fade','web','jackpot','starfield','storm','kintsugi','bloodline','marble'].concat(Object.keys(SCENES));
let scrCache=null;
function seedOffers(){const t=mkTick();if(scrCache&&scrCache.t===t&&scrCache.l===S.lvl)return scrCache.L;const r=mulberry(t*977+5),out=[];
  const pool=Object.values(SK).filter(sk=>sk.t===4&&sk.knife&&!sk.forged&&SEEDFIN.includes(sk.fin)&&REG(CASES[sk.ci])&&CASES[sk.ci].lvl<=S.lvl);
  for(let i=0;i<3&&pool.length;i++){const sk=pool[Math.floor(r()*pool.length)],f=sk.fr[0]+Math.pow(r(),1.3)*(sk.fr[1]-sk.fr[0]),x={id:'s'+t+'_'+i,s:sk.id,f,p:0,st:false,c:sk.ci};
    x.price=Math.round(naiveValue(x)/RTP*100)/100;out.push(x)}
  scrCache={t,l:S.lvl,L:out};return out}
function candidates(sk,f,rev,digs){const g=grailOf(sk),gate=supOf(sk).left>0,out=[];for(let p=0;p<1000;p++){const s=String(p).padStart(3,'0');if(s.slice(0,rev)!==digs.slice(0,rev))continue;if(p===g&&!gate)continue;out.push(p)}return out}
function possibleHTML(seed){const sk=SK[seed.s],digs=String(seed.p).padStart(3,'0'),C=candidates(sk,seed.f,seed.k,digs),grp={};let best=0,sum=0;
  C.forEach(p=>{const pi=patInfo(sk,p),v=valueOf({s:sk.id,f:seed.f,p,st:false});best=Math.max(best,v);sum+=v;const k=pi.grail?'Grail '+pi.stat:pi.tag||'Plain';(grp[k]||(grp[k]={n:0,v:0,m:pi.mult,gem:pi.gem||0})).n++;grp[k].v=Math.max(grp[k].v,v)});
  const rows=Object.entries(grp).sort((a,b)=>b[1].m-a[1].m),g=grailOf(sk),gone=supOf(sk).left<=0;
  return `<div class="poss"><div class="phead"><b>Still possible</b><span class="sub">${C.length} pattern${C.length===1?'':'s'} left · best ${money(best)} · average ${money(sum/C.length)}</span></div>
   ${rows.map(([k,o])=>`<div class="prow${o.gem?' pgem':''}${k.startsWith('Grail')?' pgr':''}"><span>${esc(k)}</span><em>${o.n} of ${C.length}</em><b>${money(o.v)}</b></div>`).join('')}
   ${gone?`<div class="prow out"><span>Grail "${esc(grailName(sk))}"</span><em>all ${supOf(sk).n} claimed</em><b>Gone</b></div>`:''}</div>`}
function drawScr(){const L=seedOffers();S.scrB=S.scrB&&S.scrB.t===mkTick()?S.scrB:{t:mkTick(),ids:[]};S.seeds=S.seeds||[];

/* a scratchable foil over a digit */
function scratchBox(el,onDone,canGo){const c=el.querySelector('canvas');if(!c)return null;const W=c.width=160,H=c.height=200,x=c.getContext('2d');

  for(let i=0;i<260;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.25})`;x.fillRect(Math.random()*W,Math.random()*H,2,2)}
  x.fillStyle='rgba(0,0,0,.45)';x.font='800 22px system-ui';x.textAlign='center';x.fillText('SCRATCH',W/2,H/2+8);
  let down=false,n=0,done=false,last=null;
  const at=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
  const check=()=>{const d=x.getImageData(0,0,W,H).data;let k=0,t=0;for(let i=3;i<d.length;i+=40){t++;if(d[i]<40)k++}if(k/t>.55)fin()};
  const dig=e=>{if(done)return;const[px,py]=at(e);x.globalCompositeOperation='destination-out';x.lineWidth=34;x.lineCap='round';x.beginPath();if(last){x.moveTo(last[0],last[1])}else x.moveTo(px,py);x.lineTo(px,py);x.stroke();last=[px,py];
    if(++n%5===0){A.dial();check()}};
  const fin=()=>{if(done)return;done=true;c.style.transition='opacity .3s';c.style.opacity=0;setTimeout(()=>c.remove(),320);onDone()};
  c.style.touchAction='none';
  c.onpointerdown=e=>{if(!canGo()){A.err();el.parentNode.querySelector('.next')&&el.parentNode.querySelector('.next').classList.add('nudge');setTimeout(()=>{const q=el.parentNode.querySelector('.nudge');q&&q.classList.remove('nudge')},500);return}A.init();down=true;last=null;c.setPointerCapture(e.pointerId);dig(e)};
  c.onpointermove=e=>{if(down)dig(e)};c.onpointerup=c.onpointercancel=()=>{down=false;last=null};
  return()=>{if(canGo())fin()}}

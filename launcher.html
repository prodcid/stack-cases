<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stack Cases</title>
<style>
:root{--bg:#000;--panel:#141415;--line:#2a2a2d;--bone:#f2f2f0;--mute:#b9b9bf;--dim:#8b8b92;--gold:#ffd24a;--dn:#ff5a52}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--bone);font:600 15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(94vw,400px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:14px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.01em}
.logo b{color:var(--gold)}
.msg{color:var(--mute);font-size:14px;min-height:22px}
.bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:35%;border-radius:99px;background:var(--gold);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.err{color:var(--dn);font-size:13px}
button{background:var(--gold);color:#1a1400;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
.tiny{color:var(--dim);font-size:11.5px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Stack <b>Cases</b></div>
  <div class="msg" id="msg">Starting…</div>
  <div class="bar" id="bar"><i></i></div>
  <div id="acts"></div>
  <div class="tiny" id="tiny">Keep this file. It pulls the latest build each time you open it, and still works offline once it has one.</div>
</div>
<script>
/* ===================================================================
   Stack Cases launcher — the one file you send your mate.
   Fetches the newest build, caches it, and runs it.
   Offline or GitHub down? It runs the last build it cached.
   =================================================================== */
var SRC = {
  // Set by ship.js setup.
  user:   'prodcid',
  repo:   'stack-cases',
  branch: 'main'
};
var FILE = 'stack-cases.html';

var msg = document.getElementById('msg'),
    bar = document.getElementById('bar'),
    acts = document.getElementById('acts'),
    tiny = document.getElementById('tiny');

function say(t){ msg.textContent = t; }
function stop(){ bar.style.display = 'none'; }

/* The cached build lives in IndexedDB, not localStorage. Every file:// page in
   Chrome shares one localStorage, and the Stack Casino launcher's cache already
   uses most of its 5MB - the game's own save needs what's left. */
function idb(mode, fn){
  return new Promise(function(resolve, reject){
    var rq;
    try { rq = indexedDB.open('stack-cases-launcher', 1); } catch(e){ return reject(e); }
    rq.onupgradeneeded = function(){ rq.result.createObjectStore('build'); };
    rq.onerror = function(){ reject(rq.error); };
    rq.onsuccess = function(){
      var tx = rq.result.transaction('build', mode), st = tx.objectStore('build'), out;
      var r = fn(st);
      if (r) r.onsuccess = function(){ out = r.result; };
      tx.oncomplete = function(){ resolve(out); };
      tx.onerror = function(){ reject(tx.error); };
    };
  });
}
function loadCache(){ return idb('readonly', function(st){ return st.get('current'); }).catch(function(){ return null; }); }
function saveCache(html, ver){ return idb('readwrite', function(st){ st.put({ html: html, ver: ver }, 'current'); }).catch(function(){}); }

function urls(){
  return [
    'https://raw.githubusercontent.com/' + SRC.user + '/' + SRC.repo + '/' + SRC.branch + '/dist/' + FILE + '?t=' + Date.now(),
    'https://cdn.jsdelivr.net/gh/' + SRC.user + '/' + SRC.repo + '@' + SRC.branch + '/dist/' + FILE
  ];
}

/* Try each mirror in turn; resolve with the first body that comes back. */
function grab(){
  var list = urls(), i = 0;
  return new Promise(function(resolve, reject){
    (function next(){
      if (i >= list.length) return reject(new Error('all mirrors failed'));
      fetch(list[i++], { cache: 'no-store' })
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(resolve)
        .catch(next);
    })();
  });
}

function boot(html, version){
  // Runs on this launcher's own origin, so the game's saves survive every update.
  document.open();
  document.write(html);
  document.close();
  try { console.log('Stack Cases build ' + version); } catch(e){}
}

function verOf(html){
  var m = /<meta name="stack-version" content="([^"]*)">/.exec(html || '');
  return m ? m[1] : null;
}

function offerCached(note){
  loadCache().then(function(c){
    stop();
    if (c && c.html){
      say('Running your last saved build');
      tiny.innerHTML = '<span class="err">' + note + '</span>';
      setTimeout(function(){ boot(c.html, c.ver || 'cached'); }, 700);
    } else {
      say('Could not download the game');
      tiny.innerHTML = '<span class="err">' + note + '</span><br><br>' +
        'No saved copy on this device yet, so the first run needs internet. Check your connection and try again.';
      acts.innerHTML = '<button onclick="location.reload()">Try again</button>';
    }
  });
}

function start(){
  if (SRC.user === 'USER'){
    stop();
    say('Launcher not configured yet');
    tiny.innerHTML = 'Run <b>4 - First time setup.cmd</b> in the stack cases folder to point this file at your repo.';
    return;
  }
  say('Checking for updates…');
  /* Always fetch the build itself rather than trusting version.json: the CDN can
     serve the two files out of step, and a launcher that trusts the side-file can
     pin itself to a stale build. The build is ~400KB. Just fetch it. */
  grab().then(function(html){
    if (!html || html.length < 10000) throw new Error('build looks truncated');
    var ver = verOf(html) || 'unknown';
    return saveCache(html, ver).then(function(){ boot(html, ver); });
  }).catch(function(e){
    offerCached('Could not reach the update server (' + e.message + ').');
  });
}

start();
</script>
</body>
</html>
